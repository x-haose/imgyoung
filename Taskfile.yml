# ImgYoung 开发入口:task <name>(https://taskfile.dev)
version: '3'

# 全程纯 Go:构建、测试、lint 都在 CGO_ENABLED=0 下进行,与发布二进制保持同一套构建条件
env:
  CGO_ENABLED: '0'

tasks:
  web:
    desc: 构建管理后台前端(产物进 web/dist,随 go:embed 打进二进制)
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build

  build:
    desc: 构建单二进制(纯 Go,无 cgo;含后台前端产物)
    deps: [web]
    cmds:
      - go build -trimpath -o imgyoung ./cmd/imgyoung

  test:
    desc: 全量测试(含数据竞争检测)
    cmds:
      - go test -race ./...

  e2e:
    desc: 端到端测试(编译真实二进制并启动进程;先构建前端以覆盖 SPA 冒烟)
    deps: [web]
    cmds:
      - go test -tags e2e -count=1 ./e2e/ -timeout 300s

  lint:
    desc: lint 门禁:0 issue 才算过(质量红线);同时确认 go.mod/go.sum 已 tidy
    cmds:
      - golangci-lint run
      - go mod tidy -diff

  generate:
    desc: 重新生成 sqlc 查询代码
    cmds:
      - sqlc generate

  run:
    desc: 本地运行
    deps: [build]
    cmds:
      - ./imgyoung

  docker:
    desc: 构建 Docker 镜像
    cmds:
      - docker build -t imgyoung:dev .
