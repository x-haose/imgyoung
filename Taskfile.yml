# ImgYoung 开发入口:task <name>(https://taskfile.dev)
version: '3'

# 全程纯 Go:构建、测试、lint 都在 CGO_ENABLED=0 下进行,与发布二进制保持同一套构建条件。
# nodynamic 关掉 webp 库运行期 dlopen 系统 libwebp 的路径,linux 二进制才是真正静态的(distroless/static 才能起)。
env:
  CGO_ENABLED: '0'
  GOFLAGS: -tags=nodynamic

tasks:
  web:
    desc: 构建管理后台前端(产物进 web/dist,随 go:embed 打进二进制)
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build

  build:
    desc: 构建单二进制(纯 Go,无 cgo;含后台前端产物)
    deps: [web]
    cmds:
      - go build -trimpath -o imgyoung ./cmd/imgyoung

  test:
    desc: 全量测试(含数据竞争检测)
    # 竞争检测运行时在 linux / windows 上需要 cgo,macOS 不需要;被测代码本身仍是纯 Go
    env:
      CGO_ENABLED: '{{if eq OS "darwin"}}0{{else}}1{{end}}'
    cmds:
      - go test -race ./...

  e2e:
    desc: 端到端测试(编译真实二进制并启动进程;先构建前端以覆盖 SPA 冒烟)
    deps: [web]
    cmds:
      - go test -tags e2e -count=1 ./e2e/ -timeout 300s

  lint:
    desc: lint 门禁:Go、后台前端、文档站与安装脚本都 0 issue 才算过(质量红线);同时确认 go.mod/go.sum 已 tidy
    cmds:
      - golangci-lint run
      - go mod tidy -diff
      - cd web && pnpm lint
      - cd docs && pnpm lint
      - shellcheck -s sh install.sh

  docs:
    desc: 文档站本地预览(http://localhost:3000;接口参考页读 api/openapi.yaml)
    dir: docs
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm dev

  generate:
    desc: 重新生成 sqlc 查询代码
    cmds:
      - sqlc generate

  run:
    desc: 本地运行
    deps: [build]
    cmds:
      - ./imgyoung

  docker:
    desc: 构建 Docker 镜像(版本号取自 git 描述,传给镜像内的 Go 构建)
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse HEAD
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} -t imgyoung:dev .
