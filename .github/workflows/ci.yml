# CI 门禁:lint 0 issue + 生成文件未过期 + go.mod 已 tidy + 全量测试(-race)+ e2e + 纯 Go 构建 + Docker 镜像可构建 + 发布配置合法
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CGO_ENABLED: "0"
  # 与 Taskfile 同一套构建条件:关掉 webp 库运行期 dlopen,二进制保持静态
  GOFLAGS: -tags=nodynamic

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      # 路由树与接口类型都是生成文件,须随源码一起提交
      - name: Generated files are fresh
        run: git diff --exit-code
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
      - name: Tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race ./...
      - name: E2E
        run: go test -tags e2e -count=1 ./e2e/ -timeout 300s
      - name: Build
        run: go build -trimpath ./cmd/imgyoung

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t imgyoung:ci .
      # 镜像不只要能构建,还要能起:distroless/static 里没有动态链接器,二进制一旦非静态在此就暴露
      - name: Image starts
        run: docker run --rm imgyoung:ci -version

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
