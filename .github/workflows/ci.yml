# CI 门禁:lint 0 issue + 生成文件未过期 + go.mod 已 tidy + 全量测试(-race)+ e2e + 纯 Go 构建 + 文档站可构建 + Docker 镜像可构建 + 发布配置合法
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CGO_ENABLED: "0"
  # 与 Taskfile 同一套构建条件:关掉 webp 库运行期 dlopen,二进制保持静态
  GOFLAGS: -tags=nodynamic

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      # 路由树与接口类型都是生成文件,须随源码一起提交
      - name: Generated files are fresh
        run: git diff --exit-code
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Tidy
        run: go mod tidy -diff
      # runner 自带 shellcheck;安装脚本按 POSIX sh 检查,dash / busybox 下也要能跑
      - name: Shellcheck
        run: shellcheck -s sh install.sh
      # 竞争检测运行时在 linux 上需要 cgo(被测代码本身仍是纯 Go,构建产物不受影响)
      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: E2E
        run: go test -tags e2e -count=1 ./e2e/ -timeout 300s
      - name: Build
        run: go build -trimpath ./cmd/imgyoung

  # 文档站:类型检查、格式与构建;接口参考页在构建时由 api/openapi.yaml 生成,文档与契约不同步会在这里失败
  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # Next.js 的增量构建缓存:依赖不变时沿用上次的编译结果,源文件变了按前缀回退到同一依赖下最近的一份
      - uses: actions/cache@v6
        with:
          path: docs/.next/cache
          key: docs-next-${{ hashFiles('docs/pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.ts', 'docs/**/*.tsx', 'docs/**/*.mdx', 'docs/**/*.css', 'api/openapi.yaml') }}
          restore-keys: docs-next-${{ hashFiles('docs/pnpm-lock.yaml') }}-
      - name: Docs
        working-directory: docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t imgyoung:ci .
      # 镜像不只要能构建,还要能起:distroless/static 里没有动态链接器,二进制一旦非静态在此就暴露
      - name: Image starts
        run: docker run --rm imgyoung:ci -version

  release-config:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
