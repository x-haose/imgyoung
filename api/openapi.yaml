          schema:
            type: string
        - name: action
          in: query
          description: 动作标识，形如 `channel.create`
          schema:
            type: string
        - name: target
          in: query
          description: 操作目标标识（图片短 ID、渠道 id、Token id 等），精确匹配
          schema:
            type: string
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/until'
      responses:
        '200':
          description: 审计分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/alerts:
    get:
      operationId: listAlerts
      tags: [Admin · Operations]
      summary: 告警
      description: 缺省返回全部未恢复的告警，不分页。`status=all` 时分页返回全部告警，包括已恢复的，最新的在前。仅管理员。
      security:
        - session: []
      parameters:
        - name: status
          in: query
          description: 为 `all` 时包括已恢复的告警
          schema:
            type: string
            enum: [all]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/backups:
    get:
      operationId: listBackups
      tags: [Admin · Operations]
      summary: 备份快照列表
      description: 列出所有健康渠道（不含清理中的渠道）上的元数据库快照，最新的在前，每份快照附带存放它的渠道。仅管理员。
      security:
        - session: []
      responses:
        '200':
          description: 快照列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: 任一健康渠道列举快照失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 没有健康渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createBackup
      tags: [Admin · Operations]
      summary: 立即备份
      description: |
        立即做一次元数据库快照，写到每个健康渠道（不含清理中的渠道），各渠道再按保留份数清理旧快照。

        请求在备份完成后返回。备份在服务端执行，请求断开不会中断它。已有立即备份在进行时，新请求会在它结束后再备份一次，同时等待的请求共用这一次的结果，因此返回的快照总是晚于请求时刻。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '201':
          description: 新快照，已写到每个健康渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >-
            备份失败，错误码为 `backup_snapshot_failed`（生成快照失败）、`backup_store_failed`（有渠道没写成）或
            `backup_prune_failed`（快照都已写成，但有渠道清理旧快照失败）。错误信息列出失败的渠道与原因，已写成的渠道保留这份快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 没有健康渠道可存放快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/backups/{name}:
    get:
      operationId: downloadBackup
      tags: [Admin · Operations]
      summary: 下载快照
      description: 以附件形式下载快照文件，它本身是一个 SQLite 数据库。按优先级从存放它的健康渠道读取，一个渠道读取失败就换下一个。健康渠道上都没有这份快照时返回 404。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/snapshotName'
      responses:
        '200':
          description: 快照文件
          headers:
            Content-Disposition:
              description: 附件文件名即快照名
              schema:
                type: string
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                contentMediaType: application/vnd.sqlite3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: 存放该快照的渠道都读取失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 没有健康渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/backups/{name}/restore:
    post:
      operationId: restoreBackup
      tags: [Admin · Operations]
      summary: 从快照恢复
      description: |
        用这份快照替换当前的元数据库，全部元数据退回到快照时刻。

        1. 按优先级从存放快照的健康渠道下载，一个渠道读取失败就换下一个；健康渠道上都没有这份快照时返回 404。
        2. 检查快照是完整的 ImgYoung 元数据库，通过后暂存到数据目录，返回 202，服务随即停止。
        3. 进程管理器重新拉起服务时，用快照替换当前数据库，原数据库改名保留。没有进程管理器时，在下次手动启动时替换。

        请求在暂存完成前断开时，恢复取消，暂存撤回，服务不停止。经反向代理时，代理的读超时须长于下载快照所需的时间。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/snapshotName'
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '202':
          description: 已暂存，服务即将停止
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 快照不完整（如写入途中被中断、对象损坏），或不是 ImgYoung 的元数据库。不暂存，服务照常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 存放该快照的渠道都读取失败，或写入数据目录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 没有健康渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/image-recovery:
    post:
      operationId: recoverImages
      tags: [Admin · Operations]
      summary: 按渠道里的对象找回图片记录
      description: |
        元数据库退回到较早的状态后（从快照恢复，或最近的写入还没来得及复制出去），之后上传的图片对象仍在渠道里，库里却没有记录，链接返回 404。本接口把这些对象重新登记为图片，原链接随之恢复。

        1. 列举所有健康渠道，找出对象键形如 `<短 ID>_<SHA-256 前 8 位>`、库里没有记录的对象。
        2. 按优先级从持有对象的渠道读取内容，校验格式、尺寸与哈希前缀。
        3. 以对象键里的短 ID 登记图片，永不过期；持有对象的渠道记为已就绪，其余渠道记为待补齐并自动补齐。

        文件名、来源 Token 与有效期无法找回。多张图因查重合并而共用的物理图只保留第一张图的对象，其余图的链接无法找回。恢复点之后删除、但对象尚未被物理删除的图片，会随对象一起重新出现。

        接口可重复调用，已登记的对象下一次计为已有记录。请求断开时中止，已登记的保留。同一时刻只进行一轮。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRecoveryRequest'
      responses:
        '200':
          description: 本轮结果。个别对象没有找回不影响状态码，逐条原因见 `failures`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRecoveryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 指定的用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已有一轮找回在进行，错误码 `recovery_busy`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 列举渠道失败，或读取已有记录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 没有健康渠道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/export:
    get:
      operationId: exportMetadata
      tags: [Admin · Operations]
      summary: 导出全部元数据
      description: 以附件形式下载全部元数据，包括每张图存放在哪些渠道、对象键与哈希。渠道带 `id` 与 `created_at`，加密渠道的密钥由它们参与派生。不含渠道凭证与密码哈希。仅管理员。
      security:
        - session: []
      responses:
        '200':
          description: 全部元数据
          headers:
            Content-Disposition:
              description: 附件文件名 `imgyoung-export.json`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: 后台签发的具名上传 Token，只能用于数据面，管理后台不接受。
    session:
      type: apiKey
      in: cookie
      name: imgyoung_session
      description: 登录时设置的会话 cookie。状态变更请求还须带 `X-CSRF-Token` 头，值为该会话的 CSRF 令牌。

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: 客户端生成的幂等键。保留期（运营配置 `idempotency_key_ttl_hours`）内，同一用户用同一个键重试，返回同一张图
      schema:
        type: string
    csrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 登录或 `GET /api/admin/me` 响应里的 `csrf_token`；缺失或不匹配返回 403
      schema:
        type: string
    page:
      name: page
      in: query
      description: 页码，从 1 起；缺省 1
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    pageSize:
      name: page_size
      in: query
      description: 每页条数；缺省 20，上限 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
    since:
      name: since
      in: query
      description: 时间范围起点（含），UTC 文本 `YYYY-MM-DD HH:MM:SS`
      schema:
        type: string
    until:
      name: until
      in: query
      description: 时间范围终点（不含），UTC 文本 `YYYY-MM-DD HH:MM:SS`
      schema:
        type: string
    imageID:
      name: id
      in: path
      required: true
      description: 图片短 ID
      schema:
        type: string
    importID:
      name: id
      in: path
      required: true
      description: 导入任务 ID
      schema:
        type: string
    tokenID:
      name: id
      in: path
      required: true
      description: Token id
      schema:
        type: integer
        format: int64
    channelID:
      name: id
      in: path
      required: true
      description: 渠道 id
      schema:
        type: integer
        format: int64
    userID:
      name: id
      in: path
      required: true
      description: 用户 id
      schema:
        type: string
    candidateID:
      name: id
      in: path
      required: true
      description: 候选对 id
      schema:
        type: integer
        format: int64
    snapshotName:
      name: name
      in: path
      required: true
      description: 快照名，形如 `imgyoung-20060102-150405.000.db`
      schema:
        type: string
    variantWidth:
      name: w
      in: query
      description: 目标宽度（像素），须是运营配置 `process_widths` 中的档位；缺省不缩放
      schema:
        type: integer
    variantFormat:
      name: format
      in: query
      description: 目标格式，须是运营配置 `process_formats` 中的格式；缺省或 `auto` 时按 `Accept` 协商
      schema:
        type: string
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: 与上次响应的 ETag 一致时返回 304
      schema:
        type: string

  requestBodies:
    UploadForm:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                contentMediaType: image/*
                description: 图片文件；其文件名记为图片的原始文件名（`file_name`）
              exif_policy:
                type: string
                enum: [strip, passthrough, spoof]
                description: 本次 EXIF 档位；缺省用运营配置的全局默认
              ttl:
                type: string
                description: 有效期秒数，0 到 3153600000 的整数；`0` 或 `never` 都表示永久。缺省时用该用户的默认有效期，用户未设置则用全局默认
              private:
                type: string
                enum: ['true', 'false']
                description: 是否作为私有图保存。私有图的公开链接一律返回 404，只有带有效签名的链接能访问；缺省为 `false`
              signed_ttl:
                type: string
                description: 仅私有图使用：响应里签名链接的有效秒数，1 到 31536000（365 天）的整数；缺省为 86400（24 小时）
    UploadURL:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadURLRequest'

  responses:
    Uploaded:
      description: 已保存
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadResult'
    BadRequest:
      description: 请求体或参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证：Token 无效，或未登录 / 会话已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限。可能是 CSRF 校验失败；仍在使用初始密码（改密前只能登出、查看当前会话与修改密码）；需要管理员；或该操作不对当前角色开放
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 目标不存在，或对当前用户不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务端故障（如数据库读写失败），原因记在服务端日志，可稍后重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: 超过单图大小上限（运营配置 `max_upload_mb`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedType:
      description: 不是支持的图片格式（按 magic bytes 判定）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyPixels:
      description: 分辨率超出像素预算（运营配置 `max_pixels_mp`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 已达上传并发上限，或该用户上传过于频繁；登录接口为登录尝试过于频繁
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ChannelDeleting:
      description: 渠道正在清理中，不能编辑、测试或探测
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ChannelsUnavailable:
      description: 没有可写入的健康渠道，或同步写成的副本数少于运营配置 `min_success`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionResponse:
      description: 当前登录用户与 CSRF 令牌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    FullConfigResponse:
      description: 全量生效配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FullConfig'
    ImageDetailResponse:
      description: 图片详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageDetail'
    IssuedTokenResponse:
      description: 新 Token；`token` 为明文，只返回这一次
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssuedToken'
    ChannelResponse:
      description: 渠道信息（含探测结果与副本统计）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Channel'
    ImageBytes:
      description: |
        图片内容（HEAD 只有响应头），带强 ETag。

        - 短 ID 路径：内容不可变，缓存一年（`immutable`）。
        - 对象键路径：同一个键重新上传后会指向新图，因此为 `Cache-Control: public, no-cache`，每次用 ETag 确认，未变时返回 304。
        - 未指定 `format`、输出格式按 `Accept` 协商时，原图与衍生图的响应都带 `Vary: Accept`。
        - 处理失败、改为输出原图时，为 `Cache-Control: no-store`。
      headers:
        ETag:
          description: 强 ETag；原图为内容哈希，衍生图为哈希加处理参数
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Vary:
          schema:
            type: string
      content:
        image/*: {}
    DirectLink:
      description: >-
        访问模式为 `redirect` 且有允许直链的渠道时，重定向到渠道的公开地址。目标地址随渠道的健康状态与配置变化，因此响应为
        `Cache-Control: no-store`，CDN 与浏览器都不缓存
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
    NotModified:
      description: ETag 命中，内容未变
      headers:
        ETag:
          schema:
            type: string
    RefererRejected:
      description: Referer 未命中防盗链白名单；纯文本
      content:
        text/plain:
          schema:
            type: string
    ImageNotFound:
      description: 图片不存在、已过期或已删除；纯文本
      content:
        text/plain:
          schema:
            type: string
    ImageUnavailable:
      description: 图片存在，但没有健康渠道能读出它；纯文本
      content:
        text/plain:
          schema:
            type: string
    ImageInternalError:
      description: 查询图片元数据失败（数据库故障），可稍后重试；纯文本
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Error:
      type: object
      description: 错误信封。管理后台按 `code` 与 `params` 渲染当前语言的文案；不经管理后台的调用方可直接展示 `error`
      required: [code, error]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: 中文文案（`params` 已填入），不含内部细节与凭证
        params:
          type: object
          additionalProperties:
            type: string
          description: 文案参数，键即文案里的占位符名；没有参数的错误码省略
    ErrorCode:
      type: string
      description: 错误码，稳定的机器可读标识；同一种失败恒为同一个错误码，文案措辞变化不影响它
      enum:
        - internal
        - invalid_body
        - unauthenticated
        - csrf_rejected
        - admin_required
        - must_change_password
        - source_not_allowed
        - no_healthy_channel
        - lang_invalid
        - query_param_invalid
        - login_rate_limited
        - invalid_credentials
        - user_disabled
        - old_password_incorrect
        - password_too_short
        - user_name_taken
        - invalid_role
        - user_not_found
        - user_protected
        - cannot_delete_self
        - user_has_images
        - user_ttl_invalid
        - token_request_invalid
        - token_name_taken
        - token_id_invalid
        - token_not_found
        - token_active
        - image_not_found
        - image_not_private
        - tag_invalid
        - tag_too_many
        - batch_tags_invalid
        - signed_url_invalid
        - image_patch_invalid
        - cleanup_exempt_admin_only
        - image_expired
        - batch_ids_invalid
        - candidate_id_invalid
        - candidate_not_found
        - keeper_invalid
        - candidate_stale
        - referer_pattern_invalid
        - referer_exists
        - referer_id_invalid
        - referer_not_found
        - backup_snapshot_failed
        - backup_store_failed
        - backup_prune_failed
        - recovery_busy
        - import_input_invalid
        - import_not_found
        - import_state_invalid
        - import_no_selection
        - import_nothing_to_retry
        - import_listing_invalid
        - import_owner_only
        - import_busy
        - snapshot_name_invalid
        - snapshot_not_found
        - snapshot_corrupt
        - settings_body_invalid
        - setting_unknown
        - setting_type
        - setting_positive
        - setting_non_negative
        - setting_too_large
        - setting_range
        - setting_option
        - setting_url
        - setting_site_root
        - setting_empty
        - channel_id_invalid
        - channel_not_found
        - channel_name_exists
        - channel_deleting
        - channel_config_changed
        - channel_encrypted_immutable
        - channel_sole_replicas
        - purge_param_invalid
        - channel_name_driver_required
        - channel_name_too_long
        - channel_encrypted_direct_link
        - channel_local_path_relative
        - channel_config_key_invalid
        - channel_keep_not_secret
        - channel_keep_no_value
        - channel_unknown_backend
        - channel_unknown_template
        - channel_field_required
        - channel_param_invalid
        - channel_backend_failed
        - channel_bucket_failed
        - channel_unrepresentable
        - oauth_token_invalid
        - oauth_no_refresh_token
        - oauth_not_required
        - oauth_option_required
        - oauth_base_url_required
        - oauth_session_not_found
        - oauth_denied
        - oauth_exchange_failed
        - upload_token_invalid
        - upload_token_scope
        - upload_unauthenticated
        - upload_rate_limited
        - upload_busy
        - upload_unsupported_type
        - upload_too_many_pixels
        - upload_private_invalid
        - upload_bad_dimensions
        - upload_invalid_image
        - upload_exif_policy
        - upload_quota_exceeded
        - upload_unavailable
        - upload_ttl_invalid
        - upload_too_large
        - upload_field_too_long
        - upload_no_file
        - url_body_invalid
        - url_required
        - url_scheme
        - url_blocked
        - url_too_many_redirects
        - url_too_large
        - url_bad_status
        - url_fetch_failed
        - variant_params_invalid
    FailureReason:
      type: string
      description: 失败原因的分类，按底层错误判定；`unclassified` 表示无法归类，此时以 `detail` 的原始错误为准
      enum:
        - s3_auth
        - app_credentials
        - grant_revoked
        - auth
        - forbidden
        - bucket_missing
        - region_mismatch
        - dns
        - connect
        - tls
        - timeout
        - permission
        - probe_mismatch
        - config_unreadable
        - no_source
        - channel_unavailable
        - object_missing
        - unclassified
    Failure:
      type: object
      description: 一次失败的结论
      required: [reason, detail]
      properties:
        reason:
          $ref: '#/components/schemas/FailureReason'
        detail:
          type: string
          description: 原始错误信息，已去除凭证，最长 200 个字符，多为服务商或网络库的英文原文；分类已足以说明问题时可能为空
    ChannelReplicaState:
      type: string
      description: 副本状态：`pending` 待补、`uploading` 补齐中、`done` 已就绪、`failed` 补齐失败
      enum: [pending, uploading, done, failed]
    ChannelReplica:
      type: object
      required: [image_id, image_count, state, attempts, failure, size, mime, updated_at]
      properties:
        image_id:
          type: [string, 'null']
          description: 引用这个物理图的最早一张图片的短 ID；没有任何图片引用它（等待回收）时为 null
        image_count:
          type: integer
          format: int64
          description: 引用这个物理图的图片张数
        state:
          $ref: '#/components/schemas/ChannelReplicaState'
        attempts:
          type: integer
          format: int64
          description: 累计补齐尝试次数
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
          description: 最近一次补齐失败的结论；没有失败过为 null
        size:
          type: integer
          format: int64
          description: 存储字节
        mime:
          type: string
          description: 真实 MIME
        updated_at:
          type: string
          description: 状态最近更新时刻
    ChannelReplicaList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelReplica'
        total:
          type: integer
          format: int64
          description: 过滤后的总条数
    ChannelReplicaRetry:
      type: object
      required: [retried, queued]
      properties:
        retried:
          type: integer
          format: int64
          description: 改回待补的副本数
        queued:
          type: boolean
          description: 它们是否已全部入队。为 false 时副本已经是待补，会在下一次周期对账时排队，不必再点一次
    ChannelFailure:
      type: object
      description: 渠道最近一次失败的结论
      required: [stage, reason, detail]
      properties:
        stage:
          type: string
          enum: [probe, load, drain]
          description: 失败环节：`probe` 健康探测，`load` 按配置装载驱动，`drain` 删除清理中渠道上的对象
        reason:
          $ref: '#/components/schemas/FailureReason'
        detail:
          type: string
          description: 原始错误信息，已去除凭证，最长 200 个字符
    UploadResult:
      type: object
      required: [id, url, private]
      properties:
        id:
          type: string
          description: 图片短 ID
        url:
          type: string
          format: uri
          description: 图片的完整访问地址；配置了 `base_url` 时以它为前缀，否则按请求推导。私有图返回的是带 `exp` 与 `sig` 参数的签名链接，可直接使用
        private:
          type: boolean
          description: 这张图是否私有。幂等键命中既有的图时以既有图为准，调用方可据此核对
        expires_at:
          type: string
          description: 私有图签名链接的到期时刻，UTC 文本；公开图没有这个字段
    UploadURLRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: 待转存的图片地址，仅 http / https 的公网地址
        file_name:
          type: string
          description: 文件名；缺省取地址的最后一段
        exif_policy:
          type: string
          enum: [strip, passthrough, spoof]
          description: 本次 EXIF 档位；缺省用运营配置的全局默认
        ttl:
          description: 有效期秒数，0 到 3153600000 的整数，可写成数字或数字字符串；`0` 或 `never` 都表示永久。缺省时用该用户的默认有效期，用户未设置则用全局默认
          oneOf:
            - type: integer
            - type: string
        private:
          type: boolean
          description: 是否作为私有图保存，规则同表单上传的 `private`
        signed_ttl:
          description: 仅私有图使用：响应里签名链接的有效秒数，规则同表单上传的 `signed_ttl`
          oneOf:
            - type: integer
            - type: string
    LoginRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          description: 登录名
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: 至少 8 个字符
    SessionUser:
      type: object
      required: [id, name, role, must_change_password]
      properties:
        id:
          type: string
          description: 用户 id
        name:
          type: string
          description: 登录名
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
          description: 仍在使用初始密码；为 true 时，除登出、`GET /api/admin/me` 与 `PUT /api/admin/me/password` 外，其余后台接口一律返回 403（`must_change_password`）
    Role:
      type: string
      enum: [admin, user]
      description: 角色
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf_token:
          type: string
          description: CSRF 令牌，状态变更请求须放在 `X-CSRF-Token` 头中
    BuildInfo:
      type: object
      description: 服务端二进制的构建信息
      required: [version, commit, built_at]
      properties:
        version:
          type: string
          description: 版本号：发布版为 git 标签，源码构建为 Go 记录的模块版本，无法确定时为 `devel`
        commit:
          type: string
          description: 构建所在提交的哈希，工作区有未提交改动时带 `-dirty` 后缀；未知为空串
        built_at:
          type: string
          description: 构建时刻，RFC 3339；发布版二进制带此值，源码构建为空串
    RuntimeConfig:
      type: object
      description: 运营配置的只读子集，所有登录用户可读；不含凭证
      required:
        - cold_cleanup_days
        - delete_grace_minutes
        - process_widths
        - default_ttl_hours
        - ttl_renew_on_access
        - max_upload_mb
        - base_url
        - access_mode
        - exif_policy
        - encrypt_new_channels
        - build
      properties:
        cold_cleanup_days:
          type: integer
          description: 冷图待清理阈值（天）；0 表示不启用
        delete_grace_minutes:
          type: integer
          description: 物理图不再被任何图片引用后，到删除其渠道副本之间的宽限（分钟）；0 表示立即删除
        process_widths:
          type: [array, 'null']
          items:
            type: integer
          description: 按需处理允许的宽度档（像素）；空或 null 表示不允许缩放
        default_ttl_hours:
          type: integer
          description: 全局默认有效期（小时）；0 表示永不过期
        ttl_renew_on_access:
          type: boolean
          description: 公开访问是否顺延带有效期图片的到期时刻
        max_upload_mb:
          type: integer
          format: int64
          description: 单图上限（MB）
        base_url:
          type: string
          description: 对外站点地址；空则按请求域名推导
        access_mode:
          type: string
          enum: [proxy, redirect]
          description: 访问模式
        exif_policy:
          type: string
          enum: [passthrough, strip, spoof]
          description: 全局默认 EXIF 档位；S3 PutObject 不适用
        encrypt_new_channels:
          type: boolean
          description: 新建渠道未指定 `encrypted` 时的默认值；为 true 时，按默认加密的新渠道不能开启 302 直链
        build:
          $ref: '#/components/schemas/BuildInfo'
    Settings:
      type: object
      description: 运营配置，属性名即配置键。保存在元数据库中，经后台或 `PUT /api/admin/config` 修改后立即生效
      required:
        - max_upload_mb
        - max_pixels_mp
        - max_concurrent_uploads
        - upload_rate_per_min
        - base_url
        - cdn_cloudflare_zone_id
        - cdn_cloudflare_api_token
        - allow_empty_referer
        - exif_policy
        - min_success
        - access_mode
        - encrypt_new_channels
        - health_check_seconds
        - backup_interval_hours
        - backup_keep
        - cleanup_sweep_seconds
        - delete_grace_minutes
        - default_ttl_hours
        - ttl_renew_on_access
        - activity_flush_seconds
        - cold_cleanup_days
        - usage_report_seconds
        - channel_quota_gb
        - dedup_scan_seconds
        - dedup_phash_max_distance
        - process_widths
        - process_formats
        - process_quality_webp
        - process_quality_jpeg
        - process_webp_method
        - process_workers
        - process_timeout_ms
        - variants_cache_mb
        - idempotency_key_ttl_hours
        - alert_webhook_url
        - audit_retention_days
        - replicate_limit_mbps
        - spoof_mode
        - spoof_camera
        - spoof_city
        - spoof_countries
        - spoof_window_days
        - max_side_px
        - max_aspect_ratio
      properties:
        max_upload_mb:
          type: integer
          format: int64
          description: 单图上限（MB）
        max_pixels_mp:
          type: integer
          format: int64
          description: 像素预算（百万像素）
        max_concurrent_uploads:
          type: integer
          description: 上传并发上限，数据面上传、后台上传与 S3 兼容接口的全部请求共用；达到上限时返回 429
        upload_rate_per_min:
          type: integer
          description: 每用户每分钟上传次数上限；0 表示不启用
        base_url:
          type: string
          description: 对外站点地址；留空按请求域名推导
        cdn_cloudflare_zone_id:
          type: string
          description: Cloudflare Zone ID
        cdn_cloudflare_api_token:
          type: string
          description: Cloudflare API Token；响应中始终为空串，是否已配置见 `derived.cdn_api_token_set`
        allow_empty_referer:
          type: boolean
          description: 空 Referer 是否放行
        exif_policy:
          type: string
          enum: [passthrough, strip, spoof]
          description: 全局默认 EXIF 档位，上传时可用 `exif_policy` 字段覆盖；不适用于 S3 PutObject，后者一律按原字节保存
        min_success:
          type: integer
          description: 上传返回成功所需的最少同步副本数
        access_mode:
          type: string
          enum: [proxy, redirect]
          description: '`proxy`：由服务读取渠道并输出图片；`redirect`：对允许直链的渠道 302 重定向'
        encrypt_new_channels:
          type: boolean
          description: 新建渠道未指定 `encrypted` 时的默认值
        health_check_seconds:
          type: integer
          description: 渠道健康检查间隔（秒）
        backup_interval_hours:
          type: integer
          description: 元数据库自动备份间隔（小时）
        backup_keep:
          type: integer
          description: 备份保留份数
        cleanup_sweep_seconds:
          type: integer
          description: 生命周期清理扫描间隔（秒）
        delete_grace_minutes:
          type: integer
          description: 物理图不再被任何图片引用后，到删除其渠道副本之间的宽限（分钟）；0 表示立即删除
        default_ttl_hours:
          type: integer
          description: 全局默认有效期（小时）；0 表示永不过期
        ttl_renew_on_access:
          type: boolean
          description: 公开访问是否顺延带有效期图片的到期时刻
        activity_flush_seconds:
          type: integer
          description: 访问统计批量写入数据库的间隔（秒）；同一张图在一个间隔内的多次访问只计一次
        cold_cleanup_days:
          type: integer
          description: 冷图待清理阈值（天）；0 表示不启用
        usage_report_seconds:
          type: integer
          description: 渠道用量上报间隔（秒）
        channel_quota_gb:
          type: integer
          description: 单渠道用量告警阈值（GB）；0 表示只上报不告警
        dedup_scan_seconds:
          type: integer
          description: 后台查重扫描间隔（秒）
        dedup_phash_max_distance:
          type: integer
          description: pHash 相似判定的汉明距离上限；0 表示不做相似扫描
        process_widths:
          type: [array, 'null']
          items:
            type: integer
          description: 按需处理允许的宽度档（像素）；空或 null 表示不允许缩放
        process_formats:
          type: array
          items:
            type: string
          description: 按需处理允许的目标格式，至少一项
        process_quality_webp:
          type: integer
          description: WebP 质量档 [1,100]
        process_quality_jpeg:
          type: integer
          description: JPEG 质量档 [1,100]
        process_webp_method:
          type: integer
          description: WebP 质量 / 速度权衡 [0,6]
        process_workers:
          type: integer
          description: 处理并发上限
        process_timeout_ms:
          type: integer
          description: 单次处理的超时（毫秒），超时则输出原图
        variants_cache_mb:
          type: integer
          format: int64
          description: 衍生图（缩放与格式转换结果）的磁盘缓存上限（MB）
        idempotency_key_ttl_hours:
          type: integer
          description: 上传幂等键保留期（小时）
        alert_webhook_url:
          type: string
          description: 告警 Webhook 地址（http / https）；空表示不外发
        audit_retention_days:
          type: integer
          description: 审计日志保留天数；0 表示永久保留
        replicate_limit_mbps:
          type: integer
          description: 后台补课写入渠道的总带宽上限（MB/s），所有渠道合计；0 表示不限。补课指新建渠道的存量补齐与对账重新排队的补齐；不限新上传触发的补齐、用户上传的同步写入与读取
        spoof_mode:
          type: string
          enum: [per_image, uniform]
          description: '`spoof` 档的身份模式。`per_image`：每张图独立随机机型与城市；`uniform`：全站固定 `spoof_camera` 与 `spoof_city`'
        spoof_camera:
          type: string
          description: '`uniform` 模式使用的机型标识，取自 `GET /api/admin/spoof-profiles` 的 `cameras`；`per_image` 模式忽略，可为空串'
        spoof_city:
          type: string
          description: '`uniform` 模式使用的城市标识，取自 `GET /api/admin/spoof-profiles` 的 `cities`；`per_image` 模式忽略，可为空串'
        spoof_countries:
          type: array
          items:
            type: string
          description: '`per_image` 模式候选城市的国家或地区代码（ISO 3166-1 alpha-2），取自 `GET /api/admin/spoof-profiles` 的 `countries`；空数组表示全部城市'
        spoof_window_days:
          type: integer
          description: '`spoof` 档写入的拍摄时间落在上传时刻往前这么多天之内，1 到 3650'
        max_side_px:
          type: integer
          description: 单边像素上限，宽或高超过它的图片被拒收
        max_aspect_ratio:
          type: integer
          description: 长边与短边之比的上限，1 到 100000，超过它的图片被拒收
    SpoofProfiles:
      type: object
      description: '`spoof` 档可选的机型、城市与国家代码'
      required: [cameras, cities, countries]
      properties:
        cameras:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                description: 机型标识，配置项 `spoof_camera` 的取值
              label:
                type: string
                description: 显示名
        cities:
          type: array
          items:
            type: object
            required: [id, name_zh, name_en, country]
            properties:
              id:
                type: string
                description: 城市标识，配置项 `spoof_city` 的取值
              name_zh:
                type: string
                description: 中文名
              name_en:
                type: string
                description: 英文名
              country:
                type: string
                description: 所在国家或地区代码（ISO 3166-1 alpha-2）
        countries:
          type: array
          items:
            type: string
          description: 城市覆盖的国家或地区代码，配置项 `spoof_countries` 的取值范围
    SettingsPatch:
      type: object
      description: 「配置键 → 新值」对象；键与值类型同 Settings，只需给出要改的键
      additionalProperties: true
    BootstrapConfig:
      type: object
      description: 引导配置（只读），不含密钥类配置项
      required: [listen, data_dir, trusted_proxies, metrics_allow]
      properties:
        listen:
          type: string
          description: HTTP 监听地址
        data_dir:
          type: string
          description: 数据目录
        trusted_proxies:
          type: string
          description: 信任其转发头的反向代理网段，逗号分隔；空串表示不信任任何转发头
        metrics_allow:
          type: string
          description: 允许访问 `/metrics` 的网段，逗号分隔；空串表示不对任何地址开放
    DerivedConfig:
      type: object
      description: 派生状态与内置策略
      required:
        - cdn_purge_enabled
        - cdn_api_token_set
        - login_burst
        - login_refill_seconds
        - reconcile_interval_seconds
      properties:
        cdn_purge_enabled:
          type: boolean
          description: 删除图片时是否清除 CDN 缓存；Zone ID、API Token 与 `base_url` 都已配置时为 true
        cdn_api_token_set:
          type: boolean
          description: Cloudflare API Token 是否已配置
        login_burst:
          type: integer
          description: 每个 IP / 用户名允许的突发登录尝试次数
        login_refill_seconds:
          type: integer
          description: 突发额度用尽后每恢复一次尝试的间隔（秒）
        reconcile_interval_seconds:
          type: integer
          description: 副本对账间隔（秒）
    FullConfig:
      type: object
      required: [bootstrap, settings, derived]
      properties:
        bootstrap:
          $ref: '#/components/schemas/BootstrapConfig'
        settings:
          $ref: '#/components/schemas/Settings'
        derived:
          $ref: '#/components/schemas/DerivedConfig'
    ChannelStat:
      type: object
      description: 仪表盘的渠道概览项
      required: [id, name, driver, healthy, bytes]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        driver:
          type: string
          description: rclone 后端名
        healthy:
          type: boolean
        bytes:
          type: integer
          format: int64
          description: 该渠道上已就绪副本的原图字节之和
    TopImage:
      type: object
      description: 热门图，按累计访问次数降序
      required: [id, url, file_name, access_count, size]
      properties:
        id:
          type: string
        url:
          type: string
          description: 公开访问路径，相对站点根
        file_name:
          type: string
        access_count:
          type: integer
          format: int64
          description: 累计公开访问次数；同一张图在一个 `activity_flush_seconds` 间隔内的多次访问只计一次，不是精确访问量
        size:
          type: integer
          format: int64
          description: 存储字节
    AdminDashboard:
      type: object
      description: 管理员视图：全站计数、待裁决数、访问量与流量估算、热门图与各渠道用量
      required:
        - offsite_missing
        - images
        - storage_bytes
        - users
        - pending_cleanup
        - pending_dedup
        - total_accesses
        - traffic_estimate_bytes
        - top_images
        - channels
      properties:
        offsite_missing:
          type: boolean
          description: 是否缺少本机以外的健康渠道：健康且不在清理中的渠道全是本机磁盘（local 驱动），或一个都没有时为 true。此时图片副本与元数据库快照只存在本机上
        images:
          type: integer
          format: int64
        storage_bytes:
          type: integer
          format: int64
        users:
          type: integer
          format: int64
        pending_cleanup:
          type: integer
          format: int64
          description: 待裁决的冷图数
        pending_dedup:
          type: integer
          format: int64
          description: 待裁决的相似候选对数
        total_accesses:
          type: integer
          format: int64
        traffic_estimate_bytes:
          type: integer
          format: int64
          description: 按「访问次数 × 原图字节」粗略估算的流量
        top_images:
          type: array
          items:
            $ref: '#/components/schemas/TopImage'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelStat'
    UserDashboard:
      type: object
      description: 普通用户视图：本人用量
      required: [images, used_bytes, quota_bytes]
      properties:
        images:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        quota_bytes:
          type: [integer, 'null']
          format: int64
          description: 配额上限；null 表示不限
    Dashboard:
      oneOf:
        - $ref: '#/components/schemas/AdminDashboard'
        - $ref: '#/components/schemas/UserDashboard'
    Token:
      type: object
      description: Token 列表项；只含明文前缀，不含哈希与完整明文
      required: [id, name, prefix, scopes, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 用途名
        prefix:
          type: string
          description: 明文前缀，用于辨认 Token
        scopes:
          type: string
          description: 授权范围，逗号分隔
        expires_at:
          type: [string, 'null']
          description: 到期时刻；null 表示永久
        last_used_at:
          type: [string, 'null']
          description: 最近使用时刻；null 表示从未使用
        revoked_at:
          type: [string, 'null']
          description: 吊销时刻；null 表示未吊销
        created_at:
          type: string
          description: 签发时刻
    TokenList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        total:
          type: integer
          format: int64
          description: 过滤后的总条数
    TokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          description: 用途名，同一用户内唯一
        expires_in_hours:
          type: integer
          format: int64
          minimum: 0
          maximum: 876000
          description: 有效期小时数；缺省或 0 表示永久
    IssuedToken:
      type: object
      required: [id, name, prefix, token]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
        token:
          type: string
          description: Token 明文，只返回这一次
    S3Credential:
      type: object
      description: 一个 Token 用于 S3 兼容接口的凭证与端点配置
      required: [access_key_id, secret_access_key, endpoint, region, bucket, url_prefix]
      properties:
        access_key_id:
          type: string
          description: 即 Token 的明文前缀
        secret_access_key:
          type: string
          description: 由主密钥派生，可随时再次获取
        endpoint:
          type: string
          format: uri
          description: 客户端填写的 S3 端点；末尾的 `/s3` 是 S3 兼容接口的路径前缀，不能省略
        region:
          type: string
          description: 服务端不区分区域，返回一个客户端普遍接受的值
        bucket:
          type: string
          description: 服务端没有桶的概念，返回一个占位名供客户端填写
        url_prefix:
          type: string
          format: uri
          description: 图片访问地址的前缀，形如 `<站点地址>/o/<用户 id>`；客户端在其后接上 `/<对象键>` 得到访问地址
    Image:
      type: object
      description: 图片列表项
      required:
        - id
        - url
        - user_id
        - user_name
        - token_id
        - token_name
        - file_name
        - mime
        - size
        - width
        - height
        - sha256
        - expire_at
        - ttl_seconds
        - last_access_at
        - access_count
        - pending_cleanup
        - cleanup_exempt
        - private
        - tags
        - created_at
        - ref_count
      properties:
        id:
          type: string
          description: 短 ID
        url:
          type: string
          description: 公开访问路径，相对站点根
        user_id:
          type: string
          description: 归属用户
        user_name:
          type: string
          description: 归属用户的登录名
        token_id:
          type: [integer, 'null']
          format: int64
          description: 上传来源 Token；null 表示后台上传或来源 Token 记录已删除
        token_name:
          type: [string, 'null']
          description: 来源 Token 的用途名；为 null 的情况同 `token_id`
        file_name:
          type: string
          description: 原始文件名
        mime:
          type: string
          description: 按文件内容判定的 MIME 类型
        size:
          type: integer
          format: int64
          description: 存储字节
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        sha256:
          type: string
          description: 内容哈希
        expire_at:
          type: [string, 'null']
          description: 到期时刻；null 表示永久
        ttl_seconds:
          type: [integer, 'null']
          format: int64
          description: 有效时长（秒），访问续期按此顺延；null 表示永久
        last_access_at:
          type: [string, 'null']
          description: 最近一次公开访问的时刻；null 表示从未被访问
        access_count:
          type: integer
          format: int64
          description: 累计公开访问次数；同一张图在一个 `activity_flush_seconds` 间隔内的多次访问只计一次，不是精确访问量
        pending_cleanup:
          type: boolean
          description: 是否在待清理列表
        cleanup_exempt:
          type: boolean
          description: 是否已豁免冷图清理
        private:
          type: boolean
          description: 是否私有图；私有图的公开链接返回 404，只有带有效签名的链接能访问
        tags:
          type: array
          description: 标签，按名称排序；没有标签为空数组
          items:
            type: string
        created_at:
          type: string
          description: 上传时刻
        ref_count:
          type: integer
          format: int64
          description: 物理图的引用数；内容相同的图片共用一份物理图
    Replica:
      type: object
      description: 单图在一个渠道上的副本状态
      required: [channel_id, channel_name, state, attempts, failure, updated_at]
      properties:
        channel_id:
          type: integer
          format: int64
        channel_name:
          type: string
        state:
          $ref: '#/components/schemas/ReplicaState'
        attempts:
          type: integer
          format: int64
          description: 累计补齐尝试次数
        failure:
          description: 最近一次补齐失败的结论；null 表示没有失败
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        updated_at:
          type: string
          description: 状态最近更新时刻
    ReplicaState:
      type: string
      enum: [pending, uploading, done, failed]
      description: 副本状态
    ImageDetail:
      allOf:
        - $ref: '#/components/schemas/Image'
        - type: object
          required: [replicas]
          properties:
            replicas:
              type: array
              description: 物理图在各渠道的副本状态，按渠道优先级降序
              items:
                $ref: '#/components/schemas/Replica'
    ImageList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        total:
          type: integer
          format: int64
          description: 过滤后的总条数
    ImportMode:
      type: string
      description: |
        输入类型：
        - `images`：图片地址清单，直接导入
        - `text`：Markdown 或 HTML 文本，扫描后确认
        - `site`：站点地图、订阅源、网页或图片的地址，由服务端抓取并扫描，完成后确认
      enum: [images, text, site]
    ImportStatus:
      type: string
      description: |
        任务状态：
        - `scanning`：正在抓取并扫描（仅 `site`）
        - `ready`：扫描完成，等待确认要导入哪些域名
        - `importing`：正在逐张转存
        - `done`：已处理完全部条目，其中可能有失败的
        - `cancelled`：已取消
        - `aborted`：因存储配额已满、没有可用渠道或服务端故障而中止，原因见 `error_code`；未处理的条目保留，可重试
      enum: [scanning, ready, importing, done, cancelled, aborted]
    ImportItemState:
      type: string
      description: |
        条目状态：
        - `candidate`：扫描发现，等待确认
        - `pending`：已确认，等待转存
        - `done`：已导入
        - `failed`：转存失败，原因见 `error_code`
        - `skipped`：确认时所在域名未被选中
      enum: [candidate, pending, done, failed, skipped]
    ImportDocument:
      type: object
      additionalProperties: false
      required: [name, text]
      properties:
        name:
          type: string
          description: 文档名，通常是文件名。作为条目的来源显示，也决定按 HTML 还是 Markdown 解析
        text:
          type: string
          description: 文档全文，不超过 4 MiB；解析超过 15 秒按输入不合法拒绝
    ImportCreateRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/ImportMode'
        urls:
          type: array
          description: '`images` 必填：图片地址，每个都是 http 或 https 绝对地址，不能为空，同一个地址出现多次只导入一次'
          items:
            type: string
        documents:
          type: array
          description: '`text` 必填：文档，至少一份'
          items:
            $ref: '#/components/schemas/ImportDocument'
        base_url:
          type: string
          description: '`text` 可选：解析文档里相对路径的基准地址，须是 http 或 https 绝对地址。没有它，相对路径无法转成可抓取的地址，会记入扫描报告的 `unfetchable`。HTML 文档里的 `<base href>` 优先于它'
        sites:
          type: array
          description: '`site` 必填：站点地图、订阅源、网页或图片的地址，至少一个，每个都是 http 或 https 绝对地址'
          items:
            type: string
        ttl:
          description: 导入图片的有效期秒数，规则同 URL 转存的 `ttl`。缺省时用该用户的默认有效期，用户未设置则用全局默认
          oneOf:
            - type: integer
            - type: string
        exif_policy:
          type: string
          enum: [strip, passthrough, spoof]
          description: 导入图片的 EXIF 档位；缺省用运营配置的全局默认
        referer:
          type: string
          description: 抓取图片时发送的 `Referer`，须是 http 或 https 绝对地址，用于绕过只放行自家页面的防盗链。缺省时取该图片来源页的地址；来源不是网页（图片清单、文档）时不发送
        tags:
          type: array
          description: 导入的每张图自动带上的标签，规则同 `PATCH /api/admin/images/{id}` 的 `tags`；缺省不带
          maxItems: 20
          items:
            type: string
    ImportStartRequest:
      type: object
      additionalProperties: false
      required: [hosts]
      properties:
        hosts:
          type: array
          minItems: 1
          maxItems: 1000
          description: 要导入的域名，取自 `GET /api/admin/imports/{id}/hosts` 的 `host`；重复的只算一个
          items:
            type: string
    ImportCounts:
      type: object
      description: 任务各状态的条目数
      required: [candidate, pending, done, failed, skipped]
      properties:
        candidate:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        done:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
    ImportScanFailure:
      type: object
      description: 一个没有抓取成功的页面
      required: [source, code, detail]
      properties:
        source:
          type: string
          description: 页面地址
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: 根因原文，供排障
    ImportUnfetchable:
      type: object
      description: 一处服务端无法抓取的图片引用
      required: [source, reference]
      properties:
        source:
          type: string
          description: 引用所在的页面地址或文档名
        reference:
          type: string
          description: 引用原文，最长 200 个字符。常见原因：没有基准地址的相对路径、`data:` 内嵌图片、本地文件路径、非 http 与 https 的协议
    ImportScanReport:
      type: object
      description: 扫描结束时的汇总
      required:
        [pages, pages_without_images, offsite_pages, failed_pages, failed_pages_total, unfetchable, unfetchable_total]
      properties:
        pages:
          type: integer
          format: int64
          description: 扫描的页面或文档数
        pages_without_images:
          type: integer
          format: int64
          description: 其中没有找到任何图片引用的页面数。网页靠脚本渲染图片时，这里的数量会偏高
        offsite_pages:
          type: integer
          format: int64
          description: 站点地图或订阅源里不在其所属域名下、因此被跳过的页面数
        failed_pages:
          type: array
          description: 没有抓取成功的页面，同一个地址只列一次，至多 1000 条
          items:
            $ref: '#/components/schemas/ImportScanFailure'
        failed_pages_total:
          type: integer
          format: int64
          description: 没有抓取成功的页面总数；超过 1000 时大于 `failed_pages` 的长度
        unfetchable:
          type: array
          description: 服务端无法抓取的图片引用，至多 1000 条
          items:
            $ref: '#/components/schemas/ImportUnfetchable'
        unfetchable_total:
          type: integer
          format: int64
          description: 服务端无法抓取的图片引用总数；超过 1000 时大于 `unfetchable` 的长度
    ImportScan:
      type: object
      description: 扫描进度与结果
      required: [pages_found, pages_done, report]
      properties:
        pages_found:
          type: integer
          format: int64
          description: 已发现的页面数；`scanning` 期间可能还在增加
        pages_done:
          type: integer
          format: int64
          description: 已处理的页面数
        report:
          oneOf:
            - $ref: '#/components/schemas/ImportScanReport'
            - type: 'null'
          description: 扫描结束后的汇总；`scanning` 期间与没有扫描过程的 `images` 任务为 null
    ImportJob:
      type: object
      required:
        [id, user_id, user_name, mode, status, seeds, ttl_seconds, exif_policy, referer, tags, counts, scan, error_code, created_at, finished_at]
      properties:
        id:
          type: string
          description: 任务 ID
        user_id:
          type: string
          description: 创建任务的用户，导入的图片归属于他
        user_name:
          type: string
          description: 创建任务的用户的登录名
        mode:
          $ref: '#/components/schemas/ImportMode'
        status:
          $ref: '#/components/schemas/ImportStatus'
        seeds:
          type: array
          description: '`site` 任务的起始地址；其他模式为空数组'
          items:
            type: string
        ttl_seconds:
          type: [integer, 'null']
          format: int64
          description: 创建时指定的有效期秒数，0 表示永久；null 表示按用户默认与全局默认
        exif_policy:
          type: string
          description: 创建时指定的 EXIF 档位；空串表示用全局默认
        referer:
          type: string
          description: 创建时指定的 `Referer`；空串表示取来源页
        tags:
          type: array
          description: 创建时指定的标签；没有为空数组
          items:
            type: string
        counts:
          $ref: '#/components/schemas/ImportCounts'
        scan:
          $ref: '#/components/schemas/ImportScan'
        error_code:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
          description: '`aborted` 的原因：`upload_quota_exceeded`、`upload_unavailable` 或 `internal`；其他状态为 null'
        created_at:
          type: string
        finished_at:
          type: [string, 'null']
          description: 进入 `done`、`cancelled` 或 `aborted` 的时刻；重试后清空
    ImportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        total:
          type: integer
          format: int64
          description: 当前用户的任务总数
    ImportHost:
      type: object
      required: [host, count, samples]
      properties:
        host:
          type: string
          description: 域名，小写，非默认端口时带端口
        count:
          type: integer
          format: int64
          description: 该域名下待确认的条目数
        samples:
          type: array
          description: 最多 3 个示例地址
          items:
            type: string
    ImportItem:
      type: object
      required: [id, url, host, state, image_id, error_code, error_detail, sources, source_count]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: 图片的绝对地址，去掉了 `#` 之后的部分
        host:
          type: string
          description: 地址的域名，规则同 `ImportHost.host`
        state:
          $ref: '#/components/schemas/ImportItemState'
        image_id:
          type: [string, 'null']
          description: 导入成功后的图片短 ID；尚未导入、导入失败或图片已被删除时为 null
        error_code:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
          description: '`failed` 的原因，取值同上传与 URL 转存的错误码，如 `url_blocked`、`url_bad_status`、`upload_unsupported_type`；其他状态为 null'
        error_detail:
          type: string
          description: 失败的根因原文，最长 500 个字符；没有失败时为空串
        sources:
          type: array
          description: 引用这张图的页面地址或文档名，最多 5 个
          items:
            type: string
        source_count:
          type: integer
          format: int64
          description: 引用这张图的页面或文档总数
    ImportItemList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItem'
        total:
          type: integer
          format: int64
          description: 过滤后的总条数
    ImportReference:
      type: object
      required: [source, raw]
      properties:
        source:
          type: string
          description: 引用所在的页面地址或文档名
        raw:
          type: string
          description: 引用在该处的原文：相对路径或绝对地址。Markdown 的转义已还原，可能与源文件里的字面写法略有出入
    ImportMappingRow:
      type: object
      required: [old_url, new_url, image_id, references]
      properties:
        old_url:
          type: string
          description: 旧图片的绝对地址
        new_url:
          type: string
          description: 新图片的绝对访问地址
        image_id:
          type: string
          description: 新图片的短 ID
        references:
          type: array
          description: 旧图片被引用的位置，按发现顺序，不限条数
          items:
            $ref: '#/components/schemas/ImportReference'
    ImagePatch:
      type: object
      description: 要修改的项；未带的项保持不变，至少带一项
      properties:
        ttl_hours:
          type: integer
          format: int64
          minimum: 0
          maximum: 876000
          description: 大于 0 时，从现在起按该时长重新计算到期时刻；0 表示改为永久
        cleanup_exempt:
          type: boolean
          description: 设置或取消冷图清理豁免，仅管理员。设置与取消都会清除待清理标记，取消后由下一轮扫描重新判定
        private:
          type: boolean
          description: 设为私有或改回公开。私有开关每变一次，此前签发的签名链接全部失效；改回公开后原来的公开链接可用
        tags:
          type: array
          description: 整体替换这张图的标签，空数组清除全部标签。标签名去首尾空白后 1 到 32 个字符，不含控制字符，最多 20 个；标签挂在图片属主名下
          maxItems: 20
          items:
            type: string
    BatchDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          description: 待删除的短 ID
    BatchTagsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        add:
          type: array
          description: 追加的标签；与 `remove` 至少有一个非空
          items:
            type: string
            minLength: 1
            maxLength: 32
        remove:
          type: array
          description: 移除的标签
          items:
            type: string
            minLength: 1
            maxLength: 32
    BatchTagsResult:
      type: object
      required: [updated, failed]
      properties:
        updated:
          type: integer
          description: 成功修改张数
        failed:
          type: array
          description: 失败明细；全部成功时为空数组
          items:
            description: 一张图的失败明细：短 ID，加上与错误信封格式相同的失败原因
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [id]
                properties:
                  id:
                    type: string
    TagList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, image_count]
            properties:
              name:
                type: string
                description: 标签名
              image_count:
                type: integer
                format: int64
                description: 带这个标签的图片数
        total:
          type: integer
          format: int64
    BatchDeleteResult:
      type: object
      required: [deleted, failed]
      properties:
        deleted:
          type: integer
          description: 成功删除张数
        failed:
