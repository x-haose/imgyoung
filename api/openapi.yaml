  /api/admin/channel-templates:
    get:
      operationId: channelTemplates
      tags: [Admin · Storage channels]
      summary: 渠道模板清单
      description: 返回内置的服务商模板。模板预填了 rclone 后端与固定参数，只需填写必要字段。响应只含结构（模板 id、字段 key 与类型、选项值），不含模板名、字段标签、说明与选项显示名。仅管理员。
      security:
        - session: []
      responses:
        '200':
          description: 模板清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels:
    get:
      operationId: listChannels
      tags: [Admin · Storage channels]
      summary: 渠道列表
      description: 按优先级从高到低返回全部渠道，含探测结果与副本统计，不含配置与凭证。仅管理员。
      security:
        - session: []
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createChannel
      tags: [Admin · Storage channels]
      summary: 创建渠道
      description: |
        模板模式传 `template` 与 `inputs`，自定义模式传 `driver` 与 `config`。

        需要授权的模板，保存前会向服务商查询授权后才能确定的参数（如 OneDrive 选用该用户的默认驱动器），查询失败返回 400。

        保存成功后立即做一次深探测：向渠道写入一个临时小对象，读回核对后删除。装载或探测失败都不撤销创建，渠道标为不健康，原因见响应的 `failure`。随后后台把已有图片补齐到新渠道。

        `encrypted` 创建后不可更改。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ChannelResponse'
        '400':
          description: 参数非法，或后端初始化、建桶失败。保存过程中服务商刷新了令牌时，响应带 `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 渠道名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
        '500':
          description: 服务内部错误。保存过程中服务商刷新了令牌时，响应同样带 `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
  /api/admin/channels/test:
    post:
      operationId: testChannel
      tags: [Admin · Storage channels]
      summary: 测试连接
      description: |
        用与创建相同的请求体做一次深探测，不保存。探测结果以 `ok` 与 `failure` 返回，向服务商查询授权参数失败也在其中。

        测试已有渠道时带 `channel_id`，配置里的哨兵值 `__imgyoung_secret_keep__` 先换回该渠道已存的值再探测。

        授权令牌已过期时，测试过程中会刷新令牌：

        - 请求里提交的是新令牌（新建渠道，或编辑时新粘贴、新授权的令牌）：刷新后的令牌在 `token` 中返回。
        - 沿用渠道已存的令牌（哨兵值）：刷新后的令牌直接保存到该渠道，不返回。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTestRequest'
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ChannelDeleting'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}:
    put:
      operationId: updateChannel
      tags: [Admin · Storage channels]
      summary: 编辑渠道
      description: |
        整体替换渠道配置。配置里原样传回的哨兵值 `__imgyoung_secret_keep__` 表示沿用原来的值，只能用在读取配置时被掩码的敏感参数上，用在其他键上返回 400。

        以下情况返回 409，不保存：试图修改 `encrypted`；渠道正在清理中；保存期间渠道配置被另一次编辑或令牌刷新改动，此时重新保存即可。

        保存失败但服务商已刷新了令牌时：沿用已存令牌的，新令牌保存到渠道；请求里提交的新令牌，在错误响应的 `token` 中返回。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ChannelResponse'
        '400':
          description: 参数非法，或后端初始化失败。保存过程中服务商刷新了请求里提交的令牌时，响应带 `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 渠道不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
        '409':
          description: 渠道名已存在、试图变更加密属性、渠道正在清理中，或保存期间配置已被改动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
        '500':
          description: 服务内部错误。保存过程中服务商刷新了请求里提交的令牌时，响应同样带 `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveError'
    delete:
      operationId: deleteChannel
      tags: [Admin · Storage channels]
      summary: 删除渠道
      description: |
        渠道持有任何图片的唯一副本时拒绝删除（409）。

        - `purge=true`（缺省）：渠道标为清理中，返回 202。后台随后排空渠道，删除 ImgYoung 写在上面的对象：图片副本、`_imgyoung/` 下的系统对象（含元数据库快照）与深探测残留；其他程序写入的对象不动。删完后渠道才消失。
        - `purge=false`：立即删除渠道，返回 204，渠道上的对象（含快照）原样保留。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - $ref: '#/components/parameters/csrfToken'
        - name: purge
          in: query
          description: 是否删除 ImgYoung 写在渠道上的对象；缺省 true
          schema:
            type: boolean
      responses:
        '202':
          description: 已标记清理中，对象删完后移除
        '204':
          description: 已删除，远端对象保留
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 渠道持有部分图片的唯一副本，`params.count` 为这些图片的张数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}/config:
    get:
      operationId: channelConfig
      tags: [Admin · Storage channels]
      summary: 渠道配置的编辑视图
      description: 返回编辑渠道所需的配置。rclone 后端标为密码或敏感信息的参数（选项元数据里的 `IsPassword` 或 `Sensitive`，包括访问密钥 ID、账号名、OAuth 应用凭证与令牌）一律以哨兵值 `__imgyoung_secret_keep__` 代替，从不返回明文。模板渠道另外返回从配置还原出的模板字段值，按同样规则掩码。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
      responses:
        '200':
          description: 编辑视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEditConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}/rclone-config:
    get:
      operationId: channelRcloneConfig
      tags: [Admin · Storage channels]
      summary: 导出 rclone 配置
      description: |
        以附件形式下载一份 rclone 配置文件（rclone.conf），用标准 rclone 即可在 ImgYoung 之外读写渠道数据。

        - 远端 `imgyoung-<渠道 id>`：参数与渠道后端完全一致，含凭证与授权令牌；密码类参数按 rclone 规则以 obscure 形式写出。
        - 远端 `imgyoung-<渠道 id>-crypt`：只有加密渠道有，指向渠道存储路径，参数与服务端使用的 crypt 配置一致（`password`、`password2` 为 obscure 形式，`filename_encryption = standard`）。

        文件开头的 `#` 注释说明各远端及用法。注释语言由查询参数 `lang` 指定，缺省按 `Accept-Language`，没有该头时用中文。

        文件里的凭证与解密密码和主密钥同等敏感。响应不缓存，每次下载记一条 `channel.export` 审计日志。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - name: lang
          in: query
          description: 文件头注释的语言；缺省按 `Accept-Language`
          schema:
            type: string
            enum: [zh-CN, en]
      responses:
        '200':
          description: rclone 配置文件
          headers:
            Content-Disposition:
              description: 附件文件名 `imgyoung-channel-<渠道 id>.rclone.conf`
              schema:
                type: string
            Cache-Control:
              description: 恒为 `no-store`
              schema:
                type: string
            Content-Language:
              description: 文件头注释的语言，`zh-CN` 或 `en`
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 渠道配置里有 rclone 配置文件无法表示的参数值（如含换行或首尾空白）。错误信息指出远端与参数名，不含参数值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}/check:
    post:
      operationId: checkChannel
      tags: [Admin · Storage channels]
      summary: 手动重检
      description: 对渠道做一次深探测，返回探测后的渠道信息。渠道此前装载失败时先重新装载，仍失败则以装载失败作为结论。探测可能持续数十秒。清理中的渠道返回 409。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '200':
          $ref: '#/components/responses/ChannelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ChannelDeleting'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}/replicas:
    get:
      operationId: listChannelReplicas
      tags: [Admin · Storage channels]
      summary: 渠道上的副本清单
      description: |
        分页列出一个渠道上的图片副本，最近有变化的在前。迁移或补齐时，用它找出哪些图片没有补齐成功以及原因。

        一个物理图可能被多张图片引用（查重合并），所以每条给出其中最早的一张图片的短 ID 与引用张数。清理中的渠道也可以查看。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: state
          in: query
          description: |
            只看指定状态的副本，缺省为全部：
            - `pending`：待补，含补齐中，与渠道列表里的「待补」口径一致
            - `failed`：补齐失败
            - `done`：已就绪
          schema:
            type: string
            enum: [pending, failed, done]
      responses:
        '200':
          description: 副本分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelReplicaList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channels/{id}/replicas/retry:
    post:
      operationId: retryChannelReplicas
      tags: [Admin · Storage channels]
      summary: 立即重试失败的副本
      description: 把这个渠道上补齐失败的副本全部改回待补并重新排队，不必等下一次周期对账。渠道此刻不健康时它们会再次失败。清理中的渠道返回 409。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/channelID'
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '200':
          description: 已重新排队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelReplicaRetry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ChannelDeleting'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channel-oauth/start:
    post:
      operationId: startChannelOAuth
      tags: [Admin · Storage channels]
      summary: 发起网盘授权
      description: |
        返回授权地址，以及之后领取结果用的一次性 `state`。

        须先配置对外站点地址 `base_url`。回调地址为 `<base_url>/api/admin/channel-oauth/callback`，必须与在服务商开放平台登记的回调地址逐字符一致。

        自建应用的 Client ID 与 Client Secret 是模板字段，随 `inputs` 提交，并随渠道保存。为已有渠道重新授权时带 `channel_id`，字段里的哨兵值先换回该渠道已存的值。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: 授权地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ChannelDeleting'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channel-oauth/callback:
    get:
      operationId: channelOAuthCallback
      tags: [Admin · Storage channels]
      summary: 授权回调
      description: 用户在服务商完成授权后，浏览器被重定向到这里。服务端用授权码换取令牌并暂存，调用方再凭 `state` 从领取接口取得。本接口返回 HTML 提示页而非 JSON，页面里不含令牌；提示页按 `Accept-Language` 显示中文或英文。须管理员会话。
      security:
        - session: []
      parameters:
        - name: state
          in: query
          required: true
          description: 发起授权时得到的一次性标识
          schema:
            type: string
        - name: code
          in: query
          description: 授权码；用户拒绝时缺省
          schema:
            type: string
        - name: error
          in: query
          description: 授权服务器报告的拒绝原因
          schema:
            type: string
      responses:
        '200':
          description: 提示页；授权成功与失败都在此页提示，结果由领取接口给出
          content:
            text/html:
              schema:
                type: string
        '400':
          description: 授权会话已失效的提示页
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/channel-oauth/result:
    get:
      operationId: channelOAuthResult
      tags: [Admin · Storage channels]
      summary: 领取授权结果
      description: 结果只能领取一次。用户尚未完成授权时 `pending` 为 true。仅管理员。
      security:
        - session: []
      parameters:
        - name: state
          in: query
          required: true
          description: 发起授权时得到的一次性标识
          schema:
            type: string
      responses:
        '200':
          description: 授权结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 授权会话不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/users:
    get:
      operationId: listUsers
      tags: [Admin · Users]
      summary: 用户列表
