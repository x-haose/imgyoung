  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/userID'
    put:
      operationId: updateUser
      tags: [Admin · Users]
      summary: 更新用户
      description: 整体替换，须给出全部字段。内置管理员不能禁用，也不能改为普通用户（403）。仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
