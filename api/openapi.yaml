  /api/admin/images/{id}/signed-url:
    parameters:
      - $ref: '#/components/parameters/imageID'
    post:
      operationId: signImageURL
      tags: [Admin · Images]
      summary: 签发私有图的访问链接
      description: 为一张私有图签发带签名的访问链接。签名覆盖图片 ID 与到期时刻，链接到期后失效；可带 `?w=`、`?format=` 等处理参数。私有开关每变一次，此前签发的链接全部失效：要在到期前收回已发出的链接，把图片改回公开再设为私有即可（改回公开期间公开链接可访问）。公开图返回 409（`image_not_private`），普通用户操作他人的图返回 404。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              properties:
                ttl_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 31536000
                  description: 链接的有效秒数，最长 365 天
      responses:
        '200':
          description: 签名链接
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url:
                    type: string
                    format: uri
                    description: 带 `exp` 与 `sig` 参数的绝对链接
                  expires_at:
                    type: string
                    description: 链接的到期时刻，UTC 文本
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 图片不是私有图（`image_not_private`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images/{id}:
    parameters:
      - $ref: '#/components/parameters/imageID'
    get:
      operationId: getImage
      tags: [Admin · Images]
      summary: 图片详情
      description: 在列表项字段之外，附带各渠道的副本状态。普通用户查询他人的图返回 404。
      security:
        - session: []
      responses:
        '200':
          $ref: '#/components/responses/ImageDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchImage
      tags: [Admin · Images]
      summary: 修改有效期、清理豁免、私有开关或标签
      description: 至少带一个修改项。`ttl_hours`、`private` 与 `tags` 图片属主即可修改；已到期的图片不能再修改有效期，返回 409。`cleanup_exempt` 对应冷图裁决里的「保留」，仅管理员可改，普通用户带上它返回 403。普通用户修改他人的图返回 404。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 图片已到期，不能再修改有效期（`image_expired`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteImage
      tags: [Admin · Images]
      summary: 删除图片
      description: 立即删除这条图片引用；已启用 CDN 缓存清除（`derived.cdn_purge_enabled`）时，删除后在后台清除它在 CDN 上的缓存。内容相同的图片共用一份物理图，物理图不再被任何图片引用时，经过删除宽限（`delete_grace_minutes`）后，后台删除它在各渠道上的副本，以及本机的衍生图缓存。普通用户删除他人的图返回 404。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images/{id}/thumb:
    get:
      operationId: adminImageBytes
      tags: [Admin · Images]
      summary: 后台预览图
      description: 处理与 `/i/{id}` 相同，区别是用会话认证、不计公开访问、不受防盗链限制。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/imageID'
        - $ref: '#/components/parameters/variantWidth'
        - $ref: '#/components/parameters/variantFormat'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageBytes'
        '302':
          $ref: '#/components/responses/DirectLink'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '500':
          description: 服务端故障，可稍后重试。会话校验时读数据库失败返回错误信封，查询图片元数据失败返回纯文本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ImageUnavailable'

  /api/admin/imports:
    get:
      operationId: listImports
      tags: [Admin · Import]
      summary: 导入任务列表
      description: 分页返回导入任务，最新的在前。普通用户只看得到自己创建的；管理员看到全部，并可用 `user_id` 只看指定用户的。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: user_id
          in: query
          description: 只看指定用户创建的任务；仅管理员生效
          schema:
            type: string
      responses:
        '200':
          description: 导入任务分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createImport
      tags: [Admin · Import]
      summary: 创建导入任务
      description: |
        按 `mode` 创建一个导入任务。导入的图片归属当前用户，走与上传相同的处理流程：格式白名单、像素预算、EXIF 处理与存储配额照常生效。

        - `images`：`urls` 是图片地址清单。任务直接进入 `importing`，逐张转存。
        - `text`：`documents` 是 Markdown 或 HTML 文本，从中找出图片引用。文件名以 `.html` 或 `.htm` 结尾的按 HTML 解析，内容以 `<!doctype html` 或 `<html` 开头的也按 HTML 解析，其余按 Markdown 解析（内嵌的 HTML 同样会被扫描）。扫描在本请求内完成，任务进入 `ready`，等待确认。
        - `site`：`sites` 是站点地图、订阅源（RSS 或 Atom）、网页或图片的地址。任务进入 `scanning`，由服务端抓取并找出图片，完成后进入 `ready`，等待确认。

        各模式只能带自己的字段，带了其他模式的字段返回 400。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCreateRequest'
      responses:
        '201':
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          description: 请求体不合法，错误码 `import_input_invalid`，`params.detail` 指出哪一项不合法；或 `ttl`、`exif_policy` 取值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 请求体超过 32 MiB，错误码 `import_input_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`text` 模式下，文本解析的并发名额被占满，等待超过 15 秒仍没有轮到，错误码 `import_busy`，稍后重试'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}:
    get:
      operationId: getImport
      tags: [Admin · Import]
      summary: 导入任务详情
      description: 返回任务的状态、各状态的条目数与扫描报告。进行中的任务由前端轮询本接口取得进度。普通用户只能读自己的任务，管理员能读全部。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/importID'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteImport
      tags: [Admin · Import]
      summary: 删除导入任务
      description: 删除任务及其条目、来源与对照表。已经导入的图片不受影响。`scanning` 与 `importing` 的任务须先取消。管理员可以删除任何人的任务。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/importID'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务仍在进行，错误码 `import_state_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/hosts:
    get:
      operationId: listImportHosts
      tags: [Admin · Import]
      summary: 待确认的图片地址按域名分组
      description: 返回 `candidate` 状态的条目按域名分组的数量，数量多的在前，每组附最多 3 个示例地址。用于确认页决定导入哪些域名下的图片。任务确认之后没有 `candidate` 条目，返回空数组。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/importID'
      responses:
        '200':
          description: 域名分组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportHost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/items:
    get:
      operationId: listImportItems
      tags: [Admin · Import]
      summary: 导入任务的条目
      description: 分页返回任务的条目，按发现顺序排列，可按状态与域名过滤。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/importID'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: state
          in: query
          description: 只看指定状态的条目
          schema:
            $ref: '#/components/schemas/ImportItemState'
        - name: host
          in: query
          description: 只看指定域名的条目，须与分组里的 `host` 完全一致
          schema:
            type: string
      responses:
        '200':
          description: 条目分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/start:
    post:
      operationId: startImport
      tags: [Admin · Import]
      summary: 确认并开始导入
      description: |
        对 `ready` 状态的任务，导入 `hosts` 所列域名下的全部 `candidate` 条目，其余条目记为 `skipped`，任务进入 `importing`。

        `hosts` 里没有任何域名对应待导入的条目时返回 400，任务保持 `ready`。

        只有创建任务的用户能确认；管理员确认别人的任务返回 403，错误码 `import_owner_only`。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/importID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStartRequest'
      responses:
        '200':
          description: 任务已开始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          description: 请求体不合法，或所选域名下没有待导入的条目（`import_no_selection`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限，或管理员操作别人的任务（`import_owner_only`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务不在 `ready` 状态，错误码 `import_state_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/cancel:
    post:
      operationId: cancelImport
      tags: [Admin · Import]
      summary: 取消导入任务
      description: 取消 `scanning`、`ready` 或 `importing` 的任务。正在转存的图片会被中断，没处理完的条目保持 `pending`，已经导入的图片保留。管理员可以取消任何人的任务。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/importID'
      responses:
        '200':
          description: 任务已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务已经结束，错误码 `import_state_invalid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/retry:
    post:
      operationId: retryImport
      tags: [Admin · Import]
      summary: 重试失败的条目并继续
      description: |
        对 `done`、`aborted` 或 `cancelled` 的任务，把 `failed` 的条目重新置为待导入，连同尚未处理的条目一起继续，任务回到 `importing`。

        没有 `failed` 或 `pending` 的条目时返回 409。因存储配额或没有可用渠道而中止的任务，先解决问题再重试。

        只有创建任务的用户能重试；管理员重试别人的任务返回 403，错误码 `import_owner_only`。

        扫描没有完成就中止或取消的 `site` 任务没有候选可以继续，重试会让它回到 `scanning`，从头重新扫描。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/importID'
      responses:
        '200':
          description: 任务已继续
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限，或管理员操作别人的任务（`import_owner_only`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务状态不允许重试（`import_state_invalid`），或没有可重试的条目（`import_nothing_to_retry`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/imports/{id}/mapping:
    get:
      operationId: exportImportMapping
      tags: [Admin · Import]
      summary: 导出新旧链接对照表
      description: |
        以附件形式下载已导入成功的条目的对照表。新地址是图片的绝对访问地址：配置了对外站点地址（`base_url`）时用它，否则按本次请求推导。

        - `format=json`：每个条目一个对象，来源引用嵌套在 `references` 里。
        - `format=csv`：UTF-8，首行为表头，每条来源引用一行，列为 `old_url`、`new_url`、`image_id`、`source`、`raw`；没有来源引用的条目也输出一行，`source` 与 `raw` 为空。

        图片被删除后，对应条目不再出现在对照表里。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/importID'
        - name: format
          in: query
          description: 输出格式，缺省 `json`
          schema:
            type: string
            enum: [json, csv]
      responses:
        '200':
          description: 对照表
          headers:
            Content-Disposition:
              description: 附件文件名 `imgyoung-import-<任务 ID>.json` 或 `.csv`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportMappingRow'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/tokens:
    get:
