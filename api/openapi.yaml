  /api/admin/tags:
    get:
      operationId: listTags
      tags: [Admin · Images]
      summary: 我的标签
      description: 返回当前用户正在使用的标签及各自的图片数，按名称排序。没有图片使用的标签不会出现。
      security:
        - session: []
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
