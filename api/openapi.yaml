        category:
          type: string
          enum: [object_storage, drive]
        requires_oauth:
          type: boolean
          description: 须先完成授权才能保存
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'
    ChannelTemplateList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
