        default_ttl_hours:
          type: [integer, 'null']
          format: int64
          description: 上传的默认有效期（小时）；null 表示使用全局默认，0 表示永久
        disabled:
          type: boolean
        created_at:
          type: string
        used_bytes:
          type: integer
          format: int64
