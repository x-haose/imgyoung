      required: [name, password]
      properties:
        name:
          type: string
          description: 登录名
        password:
          type: string
          format: password
          description: 初始密码，至少 8 个字符
        role:
          $ref: '#/components/schemas/Role'
        quota_bytes:
          type: integer
          format: int64
          description: 配额上限；缺省或不大于 0 表示不限
        default_ttl_hours:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 876000
          description: 上传的默认有效期（小时）；缺省或 null 表示使用全局默认，0 表示永久
    UserUpdateRequest:
      type: object
      description: PUT 整体替换，须给出全部字段；含未知字段时整体拒绝
      required: [name, role, quota_bytes, default_ttl_hours, disabled]
      properties:
        name:
          type: string
          description: 登录名
        role:
          $ref: '#/components/schemas/Role'
        quota_bytes:
          type: integer
          format: int64
          description: 配额上限；不大于 0 表示不限
        default_ttl_hours:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 876000
          description: 上传的默认有效期（小时）；null 表示使用全局默认，0 表示永久
        disabled:
          type: boolean
          description: 是否禁用；内置管理员不可禁用
    PasswordResetRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: 新密码，至少 8 个字符
    RefererRule:
      type: object
      required: [id, pattern, created_at]
      properties:
        id:
          type: integer
          format: int64
        pattern:
          type: string
          description: 裸域或子域通配
        created_at:
          type: string
    RefererRuleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RefererRule'
        total:
          type: integer
          format: int64
    RefererRuleRequest:
      type: object
      required: [pattern]
      properties:
        pattern:
          type: string
          description: 裸域（`example.com`）或子域通配（`*.example.com`）
    CandidateSide:
