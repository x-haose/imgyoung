  /api/admin/tokens/{id}/s3-credential:
    post:
      operationId: tokenS3Credential
      tags: [Admin · Upload tokens]
      summary: Token 的 S3 凭证
      description: 返回 Token 用于 S3 兼容接口的凭证与端点配置。密钥由主密钥按 Token 派生，不存储，可随时再次获取。只能获取本人 Token 的凭证。与其他 POST 请求一样须带 `X-CSRF-Token`。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/tokenID'
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '200':
          description: S3 凭证与端点
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3Credential'
        '400':
