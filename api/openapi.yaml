openapi: 3.1.0
info:
  title: ImgYoung API
  version: "1"
  summary: 自部署多渠道容灾图床的 HTTP 接口
  description: |
    ImgYoung 的 HTTP 接口，分为数据面（上传、URL 转存）、图片访问与管理后台三部分。

    S3 兼容接口（`/s3/…`）不在本文档内。它按 AWS S3 规范实现 PutObject、HeadBucket、HeadObject、GetObject、DeleteObject 五个操作，错误体为 XML。PutObject 一律按原字节保存，不应用 EXIF 档位。

    认证方式有两种：

    - 数据面：具名上传 Token，在后台签发，以 `Authorization: Bearer <token>` 传入。
    - 管理后台：会话 cookie。状态变更请求还须带 `X-CSRF-Token` 头，值为登录或 `GET /api/admin/me` 返回的 CSRF 令牌。

    错误响应统一为 `{"code": "<错误码>", "error": "<中文文案>", "params": {…}}`，见 Error。图片访问接口的 403、404、500、503 例外，为纯文本。

    时刻字段除另有说明外，均为 UTC 文本 `YYYY-MM-DD HH:MM:SS`。

    本文档内嵌在二进制里，运行中的实例在 `GET /api/openapi.yaml` 提供与其版本一致的副本。
  license:
    name: MIT
    url: https://github.com/x-haose/imgyoung/blob/main/LICENSE
servers:
  - url: /
    description: 与站点同源
# 标签名是英文标识;x-displayName 是中文显示名;description 为中文说明,x-description-en 为英文说明;
# x-slug 是文档站接口参考页的路径段(/docs/api/<x-slug>)。文档站构建时读取这些字段,新增标签须全部给出。
tags:
  - name: Data plane
    x-displayName: 数据面
    description: 上传 Token 认证的上传与 URL 转存
    x-description-en: Uploads and URL fetch, authenticated with upload tokens
    x-slug: data-plane
  - name: Image access
    x-displayName: 图片访问
    description: 公开的图片输出入口，受防盗链约束
    x-description-en: Public image delivery, subject to hotlink protection
    x-slug: image-access
  - name: Admin · Session
    x-displayName: 后台·会话
    description: 登录、登出、当前用户与改密
    x-description-en: Sign in, sign out, current user and password change
    x-slug: admin-session
  - name: Admin · Overview and settings
    x-displayName: 后台·总览与配置
    description: 仪表盘与运行配置
    x-description-en: Dashboard and runtime configuration
    x-slug: admin-overview
  - name: Admin · Upload
    x-displayName: 后台·上传
    description: 会话认证的后台上传，处理流程与数据面相同
    x-description-en: Session-authenticated uploads through the same pipeline as the data plane
    x-slug: admin-upload
  - name: Admin · Images
    x-displayName: 后台·图片
    description: 图片列表、详情、修改与删除
    x-description-en: Image list, details, edits and deletion
    x-slug: admin-images
  - name: Admin · Import
    x-displayName: 后台·批量导入
    description: 从图片地址清单、Markdown 与 HTML 文本、站点地图或网页批量转存图片，并导出新旧链接对照表
    x-description-en: Bulk-import images from lists of image URLs, Markdown and HTML text, sitemaps or web pages, and export a mapping from old links to new ones
    x-slug: admin-import
  - name: Admin · Upload tokens
    x-displayName: 后台·上传 Token
    description: 具名 Token 的签发、轮转、吊销与 S3 凭证
    x-description-en: Issuing, rotating and revoking named upload tokens, and their S3 credentials
    x-slug: admin-tokens
  - name: Admin · Storage channels
    x-displayName: 后台·存储渠道
    description: 渠道模板、创建、编辑、探测、删除与网盘授权
    x-description-en: Channel templates, creation, editing, probing, deletion and cloud drive authorization
    x-slug: admin-channels
  - name: Admin · Users
    x-displayName: 后台·用户
    description: 用户账号、配额与密码重置（仅管理员）
    x-description-en: User accounts, quotas, and password resets (administrators only)
    x-slug: admin-users
  - name: Admin · Hotlink protection
    x-displayName: 后台·防盗链
    description: Referer 白名单（仅管理员）
    x-description-en: Referer allowlist (administrators only)
    x-slug: admin-referer
  - name: Admin · Review
    x-displayName: 后台·裁决
    description: 相似重复与冷图待清理的裁决（仅管理员）
    x-description-en: Review of similar duplicates and cold images awaiting cleanup (administrators only)
    x-slug: admin-review
  - name: Admin · Operations
    x-displayName: 后台·运维
    description: 审计日志、告警、备份快照与元数据导出（仅管理员）
    x-description-en: Audit log, alerts, backup snapshots, and metadata export (administrators only)
    x-slug: admin-operations
  - name: System
    x-displayName: 系统
    description: 健康检查与接口文档
    x-description-en: Health check and API document
    x-slug: system

paths:
  /healthz:
    get:
      operationId: health
      security: []
      tags: [System]
      summary: 健康检查
      description: 进程存活即返回 200，不检查数据库与渠道。
      responses:
        '200':
          description: 存活
          content:
            text/plain:
              schema:
                type: string
                const: ok
  /api/openapi.yaml:
    get:
      operationId: openapiDocument
      security: []
      tags: [System]
      summary: 接口文档
      description: 返回本文档，内容与运行中的版本一致。
      responses:
        '200':
          description: OpenAPI 文档
          content:
            application/yaml:
              schema:
                type: string

  /api/upload:
    post:
      operationId: upload
      tags: [Data plane]
      summary: 上传图片
      description: |
        以 multipart 表单上传一张图片。格式按文件内容（magic bytes）判定，支持 JPEG、PNG、GIF、WebP。超过单图大小上限或像素预算时拒绝。

        带 `Idempotency-Key` 头时，保留期内用同一个键重试，返回同一张图。
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UploadForm'
      responses:
        '200':
          $ref: '#/components/responses/Uploaded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Token 无上传权限，或用户存储配额已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedType'
        '422':
          $ref: '#/components/responses/TooManyPixels'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ChannelsUnavailable'
  /api/upload/url:
    post:
      operationId: uploadFromURL
      tags: [Data plane]
      summary: URL 转存
      description: 服务端下载远端图片，之后的处理与直传相同。只允许公网的 http / https 地址；格式按下载到的内容判定，不看远端声明的类型。
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UploadURL'
      responses:
        '200':
          $ref: '#/components/responses/Uploaded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Token 无上传权限，或用户存储配额已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedType'
        '422':
          $ref: '#/components/responses/TooManyPixels'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: 远端返回错误、重定向过多或无法取回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ChannelsUnavailable'

  /i/{id}:
    get:
      operationId: serveImage
      security: []
      tags: [Image access]
      summary: 按短 ID 输出图片
      description: |
        输出图片，并计一次公开访问。

        - 带 `w` 或 `format` 时按需缩放或转换格式，取值须在运营配置允许的档位内。
        - `format` 缺省或为 `auto` 时按 `Accept` 协商：浏览器支持且档位允许时输出 WebP。
        - 访问模式为 `redirect` 且有允许直链的渠道时，302 重定向到渠道的公开地址。需要缩放或转换格式的请求不重定向。
        - 处理失败时输出原图，并带 `Cache-Control: no-store`。

        已到期的图即使尚未被清理，也返回 404。参数非法（400）的请求不计访问。
      parameters:
        - $ref: '#/components/parameters/imageID'
        - $ref: '#/components/parameters/variantWidth'
        - $ref: '#/components/parameters/variantFormat'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageBytes'
        '302':
          $ref: '#/components/responses/DirectLink'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/RefererRejected'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '500':
          $ref: '#/components/responses/ImageInternalError'
        '503':
          $ref: '#/components/responses/ImageUnavailable'
    head:
      operationId: headImage
      security: []
      tags: [Image access]
      summary: 按短 ID 查询图片响应头
      description: >-
        响应头与 GET 相同，但不返回响应体，也不计访问。输出原图时不读取渠道上的对象；需要缩放或转换格式时，与 GET
        一样取出或生成衍生图，缓存未命中时会读取原图处理。
      parameters:
        - $ref: '#/components/parameters/imageID'
        - $ref: '#/components/parameters/variantWidth'
        - $ref: '#/components/parameters/variantFormat'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageBytes'
        '302':
          $ref: '#/components/responses/DirectLink'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/RefererRejected'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '500':
          $ref: '#/components/responses/ImageInternalError'
        '503':
          $ref: '#/components/responses/ImageUnavailable'
  /o/{user_id}/{object_key}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: 归属用户 id；对象键只在用户内唯一
        schema:
          type: string
      - name: object_key
        in: path
        required: true
        description: 通过 S3 兼容接口上传时客户端指定的对象键，可含斜杠
        schema:
          type: string
    get:
      operationId: serveImageByObjectKey
      security: []
      tags: [Image access]
      summary: 按 S3 对象键输出图片
      description: >-
        通过 S3 兼容接口上传的图片，也可以用上传时的对象键访问，行为与 `/i/{id}` 相同。同一个键重新上传后会指向新图，因此响应为
        `Cache-Control: public, no-cache`，缓存每次须用 ETag 确认。
      parameters:
        - $ref: '#/components/parameters/variantWidth'
        - $ref: '#/components/parameters/variantFormat'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageBytes'
        '302':
          $ref: '#/components/responses/DirectLink'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/RefererRejected'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '500':
          $ref: '#/components/responses/ImageInternalError'
        '503':
          $ref: '#/components/responses/ImageUnavailable'
    head:
      operationId: headImageByObjectKey
      security: []
      tags: [Image access]
      summary: 按 S3 对象键查询图片响应头
      description: >-
        响应头与 GET 相同，但不返回响应体，也不计访问。输出原图时不读取渠道上的对象；需要缩放或转换格式时，与 GET
        一样取出或生成衍生图，缓存未命中时会读取原图处理。
      parameters:
        - $ref: '#/components/parameters/variantWidth'
        - $ref: '#/components/parameters/variantFormat'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ImageBytes'
        '302':
          $ref: '#/components/responses/DirectLink'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/RefererRejected'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '500':
          $ref: '#/components/responses/ImageInternalError'
        '503':
          $ref: '#/components/responses/ImageUnavailable'

  /api/admin/auth/login:
    post:
      operationId: login
      tags: [Admin · Session]
      summary: 登录
      description: 校验用户名与密码，成功后设置会话 cookie `imgyoung_session`（HttpOnly、SameSite=Lax，HTTPS 下带 Secure）。响应体里的 CSRF 令牌用于之后的状态变更请求。按客户端地址与用户名限速。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 用户已被禁用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/auth/logout:
    post:
      operationId: logout
      tags: [Admin · Session]
      summary: 登出
      description: 删除服务端会话并清除 cookie，幂等。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/me:
    get:
      operationId: me
      tags: [Admin · Session]
      summary: 当前会话
      description: 返回当前登录用户与 CSRF 令牌，可用于页面刷新后恢复登录状态。
      security:
        - session: []
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/me/password:
    put:
      operationId: changePassword
      tags: [Admin · Session]
      summary: 修改当前用户密码
      description: 校验旧密码后修改，成功后该用户的全部会话失效，须重新登录。新密码至少 8 个字符。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 已修改，会话已失效
        '400':
          description: 请求体非法、旧密码不正确或新密码过短
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/dashboard:
    get:
      operationId: dashboard
      tags: [Admin · Overview and settings]
      summary: 仪表盘
      description: 管理员得到全站概览，普通用户得到本人用量。两者以响应里有无 `channels` 区分。
      security:
        - session: []
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/config:
    get:
      operationId: runtimeConfig
      tags: [Admin · Overview and settings]
      summary: 运行配置（只读）
      description: 返回运营配置中界面展示所需的子集（阈值、档位等）与服务端构建信息，不含任何凭证。所有登录用户可读。
      security:
        - session: []
      responses:
        '200':
          description: 运行配置的只读子集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateConfig
      tags: [Admin · Overview and settings]
      summary: 修改运营配置
      description: |
        请求体为「配置键 → 新值」对象，只修改出现的键，保存后立即生效。有未知键或任一取值非法时整体拒绝，不会只改一部分。

        时长类配置项（间隔、宽限、有效期、保留期、超时）的上限都是 100 年，按配置项的单位折算：876000 小时、36500 天、52560000 分钟、3153600000 秒、3153600000000 毫秒。

        `cdn_cloudflare_api_token` 传空串表示清除，不传表示保持不变。

        仅管理员。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          $ref: '#/components/responses/FullConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/config/full:
    get:
      operationId: fullConfig
      tags: [Admin · Overview and settings]
      summary: 全量生效配置
      description: 返回引导配置（环境变量，只读）、运营配置（后台设置）的当前值与派生状态；运营配置里的凭证字段为空串。仅管理员。
      security:
        - session: []
      responses:
        '200':
          $ref: '#/components/responses/FullConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/spoof-profiles:
    get:
      operationId: spoofProfiles
      tags: [Admin · Overview and settings]
      summary: 伪装档的机型与城市清单
      description: 返回 `spoof` 档可选的机型、城市与国家代码，设置页据此填充选项。清单内置在程序里，随版本变化；已入库的图片不受影响。仅管理员。
      security:
        - session: []
      responses:
        '200':
          description: 机型、城市与国家清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpoofProfiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/upload:
    post:
      operationId: sessionUpload
      tags: [Admin · Upload]
      summary: 后台上传图片
      description: 处理与限制和 `POST /api/upload` 相同，包括大小、格式、像素、上传并发上限、上传频率与配额。图片归属当前会话用户，不记来源 Token。
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UploadForm'
      responses:
        '200':
          $ref: '#/components/responses/Uploaded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF 校验失败，或用户存储配额已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedType'
        '422':
          $ref: '#/components/responses/TooManyPixels'
        '429':
          $ref: '#/components/responses/TooManyRequests'
