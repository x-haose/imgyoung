          type: integer
          format: int64
    DedupMergeRequest:
      type: object
      required: [keep_blob_id]
      properties:
        keep_blob_id:
          type: integer
          format: int64
          description: 保留的物理图 id，须是候选对中的一方
    CleanupItem:
      type: object
      description: 待清理的冷图
      required: [id, url, user_id, file_name, mime, size, width, height, last_access_at, created_at]
      properties:
        id:
          type: string
        url:
          type: string
          description: 公开访问路径
        user_id:
          type: string
        file_name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        last_access_at:
          type: [string, 'null']
          description: 最近一次公开访问的时刻；null 表示从未被访问
        created_at:
          type: string
    CleanupList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CleanupItem'
        total:
          type: integer
          format: int64
    AuditEntry:
      type: object
      required: [id, actor, actor_name, action, target, detail, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
          description: 操作者用户 id
        actor_name:
          type: string
          description: 操作者的登录名；账号已删除时取 `actor` 的值
        action:
          type: string
          description: 动作标识，形如 `channel.create`
        target:
          type: string
          description: 操作目标标识
        detail:
          type: string
          description: 附加说明
        created_at:
          type: string
    AuditList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          format: int64
    Alert:
      type: object
      required: [id, kind, target, message, params, opened_at, resolved_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [channel_unhealthy, replication_failed, channel_quota_exceeded, drain_failed, backup_failed]
          description: 告警类型
        target:
          type: string
          description: 告警对象，如渠道名；没有对象时为空串
        message:
          type: string
          description: 中文描述
        params:
          type: object
          additionalProperties:
            type: string
          description: |
            描述参数，管理后台按 `kind` 与它显示当前语言的描述；没有参数时为空对象。各类型的键：

            - `channel_unhealthy`、`drain_failed`：`stage`、`reason`、`detail`，含义同 ChannelFailure；渠道尚未探测过时为空对象。
            - `replication_failed`：`failed`。
            - `channel_quota_exceeded`：`bytes`、`quota`。
            - `backup_failed`：`code`（ErrorCode），加上该错误码的文案参数。
        opened_at:
          type: string
        resolved_at:
          type: [string, 'null']
          description: 恢复时刻；null 表示仍未恢复
    AlertList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        total:
          type: integer
          format: int64
    Snapshot:
      type: object
      description: 一份元数据库快照及存放它的渠道
      required: [name, size, taken_at, channels]
      properties:
        name:
          type: string
          description: 文件名，形如 `imgyoung-20060102-150405.000.db`（UTC 时间）
        size:
          type: integer
          format: int64
          description: 字节数
        taken_at:
          type: string
          format: date-time
          description: 快照时刻，RFC 3339，毫秒精度
        channels:
          type: array
          description: 存放该快照的健康渠道名，按优先级从高到低；在立即备份的响应里，为写入了这份快照的全部渠道
          items:
            type: string
    SnapshotList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        total:
          type: integer
          format: int64
    ImageRecoveryRequest:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: 找回的图片归属的用户 ID，缺省为当前管理员
    ImageRecoveryResult:
      type: object
      required: [scanned, recorded, recovered, failed, failures]
      properties:
        scanned:
          type: integer
          description: 健康渠道上对象键合规的对象数，同一对象在多个渠道上只计一次
        recorded:
          type: integer
          description: 其中库里已有记录的对象数，含正在上传、即将落库的
        recovered:
          type: integer
          description: 重新登记的图片数
        failed:
          type: integer
          description: 没有找回的对象数
        failures:
          type: array
          description: 没有找回的对象，按对象键升序，至多 100 条
          items:
            $ref: '#/components/schemas/ImageRecoveryFailure'
    ImageRecoveryFailure:
      type: object
      required: [key, reason, detail]
      properties:
        key:
          type: string
          description: 渠道内对象键
        reason:
          type: string
          description: |
            失败原因：
            - `read_failed`：持有对象的渠道都读取失败，渠道恢复后重试
            - `too_large`：对象超过当前的单图字节上限
            - `invalid_image`：内容不是可解析的 jpeg、png、gif 或 webp，或超出像素预算
            - `key_mismatch`：内容的哈希与对象键里的哈希前缀不符
            - `id_taken`：对象键里的短 ID 已属于另一条图片记录
            - `register_failed`：登记时落库失败
          enum: [read_failed, too_large, invalid_image, key_mismatch, id_taken, register_failed]
        detail:
          type: string
          description: 根因原文，供排障
    RestoreAccepted:
      type: object
      required: [snapshot, staged]
      properties:
        snapshot:
          type: string
          description: 快照名
        staged:
          type: string
          description: 暂存文件路径
    TokenExport:
      type: object
      description: 导出的 Token，不含哈希
      required: [id, user_id, name, prefix, scopes, revoked_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: string
        revoked_at:
          type: [string, 'null']
          description: 吊销时刻；null 表示有效
        created_at:
          type: string
    ImageExport:
      type: object
      description: 导出的图片引用
      required:
        - id
        - blob_id
        - user_id
        - token_id
        - file_name
        - object_key
        - expire_at
        - ttl_seconds
        - last_public_access_at
        - access_count
        - pending_cleanup
        - cleanup_exempt
        - private
        - tags
        - created_at
      properties:
        id:
          type: string
        blob_id:
          type: integer
          format: int64
        user_id:
          type: string
        token_id:
          type: [integer, 'null']
          format: int64
        file_name:
          type: string
        object_key:
          type: [string, 'null']
          description: 通过 S3 兼容接口上传时客户端指定的对象键；null 表示没有
        expire_at:
          type: [string, 'null']
        ttl_seconds:
          type: [integer, 'null']
          format: int64
        last_public_access_at:
          type: [string, 'null']
        access_count:
          type: integer
          format: int64
        pending_cleanup:
          type: boolean
        cleanup_exempt:
          type: boolean
        private:
          type: boolean
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
    BlobExport:
      type: object
      description: 导出的物理图
      required:
        - id
        - sha256
        - phash
        - storage_key
        - mime
        - size
        - width
        - height
        - ref_count
        - pending_delete
        - delete_after
        - created_at
      properties:
        id:
          type: integer
          format: int64
        sha256:
          type: string
        phash:
          type: string
          description: 64 位感知哈希，16 位十六进制
        storage_key:
          type: string
          description: 各渠道内的对象键
        mime:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        ref_count:
          type: integer
          format: int64
        pending_delete:
          type: boolean
          description: 是否已进入物理删除流程
        delete_after:
          type: [string, 'null']
          description: 最早可物理删除的时刻；null 表示尚未安排删除
        created_at:
          type: string
    BlobChannelExport:
      type: object
      description: 导出的副本记录：一个物理图在一个渠道上的副本
      required: [blob_id, channel_id, state, attempts, last_error_reason, last_error, updated_at]
      properties:
        blob_id:
          type: integer
          format: int64
        channel_id:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/ReplicaState'
        attempts:
          type: integer
          format: int64
        last_error_reason:
          type: string
          description: 最近一次失败的归类（FailureReason）；空串表示没有失败
        last_error:
          type: string
          description: 最近一次失败的原始错误信息；空串表示没有失败
        updated_at:
          type: string
    Export:
      type: object
      description: 全部元数据；不含渠道凭证与密码哈希
      required: [users, channels, tokens, images, blobs, blob_channels]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenExport'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageExport'
        blobs:
          type: array
          items:
            $ref: '#/components/schemas/BlobExport'
        blob_channels:
          type: array
          items:
            $ref: '#/components/schemas/BlobChannelExport'
