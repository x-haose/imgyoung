        pending:
          type: integer
          format: int64
          description: 待补齐副本数（含进行中）
        failed:
          type: integer
          format: int64
          description: 补齐失败副本数
    Channel:
      type: object
      description: 渠道信息，不含配置与凭证
      required:
        - id
        - name
        - driver
        - priority
        - healthy
        - encrypted
        - allow_direct_link
        - last_checked_at
        - failure
        - deleting
        - replicas
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        driver:
          type: string
          description: rclone 后端名
        priority:
          type: integer
          format: int64
          description: 越大越优先
        healthy:
          type: boolean
        encrypted:
          type: boolean
        allow_direct_link:
          type: boolean
        last_checked_at:
          type: string
          description: 最近探测时刻；空表示尚未探测
        failure:
          description: 最近一次失败的结论；null 表示最近一次探测成功，或尚未出过错
          oneOf:
            - $ref: '#/components/schemas/ChannelFailure'
            - type: 'null'
        deleting:
          type: boolean
          description: 是否正在清理中：后台正在删除渠道上的对象，删完后渠道消失
        replicas:
          $ref: '#/components/schemas/ReplicaStats'
        created_at:
          type: string
          description: 创建时刻；加密渠道的 crypt 密码与盐由它和 `id` 参与派生
    ChannelList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        total:
          type: integer
          format: int64
    ChannelCreateRequest:
      type: object
      description: 两种配置方式二选一：模板模式传 `template` 与 `inputs`；自定义模式 `template` 为空或 `custom`，传 `driver` 与 `config`。含未知字段时整体拒绝
      required: [name]
      properties:
        template:
          type: string
          description: 模板 id；空或 `custom` 表示自定义模式
        inputs:
          type: object
          additionalProperties:
            type: string
          description: 模板字段值
        driver:
          type: string
          description: 自定义模式的 rclone 后端名
        config:
          type: object
          additionalProperties:
            type: string
          description: 自定义模式的 rclone 后端参数；另有两个由 ImgYoung 使用、不传给 rclone 的键：`path`（后端内路径，即桶名或目录）与 `public_base_url`（302 直链的地址前缀）
        name:
          type: string
          description: 渠道名，唯一
        priority:
          type: integer
          format: int64
          description: 越大越优先；缺省 0
        encrypted:
          type: boolean
          description: 是否加密；缺省取运营配置 `encrypt_new_channels`，创建后不可更改
        allow_direct_link:
          type: boolean
          description: 是否允许 302 直链；缺省 false
        auto_create_bucket:
          type: boolean
          description: 创建时自动建桶，凭证须有建桶权限；缺省 false
    ChannelUpdateRequest:
      type: object
      description: 结构与创建相同。PUT 整体替换，须给出全部字段；配置里原样传回的哨兵值表示沿用原值
      required: [name, priority, allow_direct_link]
      properties:
        template:
          type: string
        inputs:
          type: object
          additionalProperties:
            type: string
        driver:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        name:
          type: string
        priority:
          type: integer
          format: int64
        encrypted:
          type: boolean
          description: 可以传，但必须与当前值一致
        allow_direct_link:
          type: boolean
    ChannelTestRequest:
      allOf:
        - $ref: '#/components/schemas/ChannelCreateRequest'
        - type: object
          properties:
            channel_id:
              type: integer
              format: int64
              description: 测试已有渠道时传它的 id，配置里的哨兵值先换回该渠道已存的值再探测；0 或缺省表示测试新渠道
    ChannelTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 探测是否通过
        failure:
          $ref: '#/components/schemas/Failure'
          description: 探测失败的结论，原文不含凭证；通过时省略
        token:
          type: string
          description: >-
            测试过程中服务商刷新了请求里提交的授权令牌时出现，探测失败时也可能出现。值为刷新后的令牌 JSON，格式与 rclone 的
            `token` 参数相同。出现时，调用方须用它替换请求里的令牌再保存：刷新令牌只能用一次的服务商（如 Box）已作废原令牌。模板模式替换
            `inputs.token`，自定义模式替换 `config.token`。只返回令牌，不返回其他凭证
    ChannelSaveError:
      description: 创建、编辑渠道失败的响应：错误信封，外加保存过程中服务商刷新出的令牌
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            token:
              type: string
              description: >-
                保存过程中服务商刷新了请求里提交的授权令牌时出现，值为刷新后的令牌 JSON。调用方须换用它再提交：刷新令牌只能用一次的服务商（如
                Box）已作废原令牌。编辑时沿用渠道已存令牌的，不会出现此字段，刷新后的令牌已保存到渠道
    ChannelEditConfig:
      type: object
      description: 编辑渠道用的配置，敏感参数以哨兵值代替
      required: [template, driver, config]
      properties:
        template:
          type: string
          description: 配置所用模板 id；空表示自定义
        driver:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: 掩码后的后端参数
        inputs:
          type: object
          additionalProperties:
            type: string
          description: 模板字段的值，对应敏感参数的字段同样以哨兵值代替；只有模板渠道有
    OAuthStartRequest:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: 模板 id，须为需要授权的模板
        inputs:
          type: object
          additionalProperties:
            type: string
          description: 已填写的模板字段：影响端点的参数（如区域）与自建应用的 `client_id`、`client_secret`；授权令牌字段不使用
        channel_id:
          type: integer
          format: int64
          description: 为已有渠道重新授权时传它的 id，字段里的哨兵值先换回该渠道已存的值；0 或缺省表示新建渠道
    OAuthStartResponse:
      type: object
      required: [auth_url, state]
      properties:
        auth_url:
          type: string
          format: uri
          description: 让用户在浏览器中打开的授权地址
        state:
          type: string
          description: 领取结果用的一次性标识
    OAuthResult:
      type: object
      required: [pending]
      properties:
        pending:
          type: boolean
          description: 用户尚未完成授权
        token:
          type: string
          description: 授权令牌；在创建或编辑渠道的请求里作为 `inputs.token` 提交
        code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: 授权失败时的中文文案；与 `code`、`params` 一起出现，含义同错误信封
        params:
          type: object
          additionalProperties:
            type: string
          description: 授权失败时的文案参数
    User:
      type: object
