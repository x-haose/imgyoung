        image_id:
          type: string
          description: 引用该物理图的任一图片的短 ID，用于预览；空串表示暂无引用
        mime:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        refs:
          type: integer
          format: int64
          description: 引用数；合并后这些引用并入保留方
    DedupCandidate:
      type: object
      required: [id, distance, created_at, a, b]
      properties:
        id:
          type: integer
          format: int64
        distance:
          type: integer
          format: int64
          description: pHash 汉明距离
        created_at:
          type: string
          description: 发现时刻
        a:
          $ref: '#/components/schemas/CandidateSide'
