# ImgYoung lint 门禁:0 issue 才允许合并(项目质量红线)。
# default: standard 已含 errcheck / govet / ineffassign / staticcheck / unused。
version: "2"

run:
  build-tags:
    - e2e

# 不截断、不按行合并:全部问题一次列出,门禁按 0 issue 判定
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: standard
  enable:
    - copyloopvar # 循环变量误捕获
    - depguard    # 层间依赖方向机器强制
    - errorlint   # 错误比较必须走 errors.Is/As
    - funlen      # 函数长度红线(50 行,不含注释;测试函数豁免)
    - gocritic    # 通用代码体检
    - gosec       # 安全静态分析
    - misspell    # 注释与字符串拼写
    - nestif      # if 嵌套深度红线
    - nolintlint  # nolint 指令必须有效、具体、带理由
    - revive      # 风格与导出注释,全量规则按需关
    - unconvert   # 冗余类型转换
    - unparam     # 无用参数
  settings:
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    nestif:
      min-complexity: 4
    misspell:
      # unknwon 是 rclone 配置文件所用 INI 库 github.com/unknwon/goconfig 的上游账号名,出现在导入路径里
      ignore-rules: [unknwon]
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    # 依赖方向:http → core → {infra, store};store 与 infra 是并列叶子。store 是公开包,不 import 任何 internal 包。
    # deny 只列同项目内的越界目标,外部依赖不受限。
    depguard:
      rules:
        store:
          files: ["**/store/**"]
          deny:
            - pkg: github.com/x-haose/imgyoung/internal
              desc: store 是公开可复用的存储引擎,不得依赖应用内部包
        infra:
          files: ["**/internal/infra/**"]
          deny:
            - pkg: github.com/x-haose/imgyoung/internal/core
              desc: infra 是基建叶子,不得依赖 core
            - pkg: github.com/x-haose/imgyoung/store
              desc: infra 不得依赖 store
            - pkg: github.com/x-haose/imgyoung/internal/http
              desc: infra 不得依赖传输层
        core:
          files: ["**/internal/core/**"]
          deny:
            - pkg: github.com/x-haose/imgyoung/internal/http
              desc: core 不得依赖传输层(入站适配器只能反向依赖 core)
        http:
          files: ["**/internal/http/**"]
          deny:
            - pkg: github.com/x-haose/imgyoung/store
              desc: 选路与容灾属于 core,传输层经 core 访问存储
        # 测试环境装配(真实库 + 本地渠道)只供测试使用,生产代码引用它即把测试替身带进二进制。
        testonly:
          files: ["$all", "!$test"]
          deny:
            - pkg: github.com/x-haose/imgyoung/internal/core/testenv
              desc: 测试环境装配只供 _test.go 使用
            - pkg: github.com/x-haose/imgyoung/internal/http/apitest
              desc: 接口测试辅助只供 _test.go 使用
    revive:
      enable-all-rules: true
      rules:
        # 魔数以命名常量表达是风格判断,逐处 nolint 比规则本身更吵
        - name: add-constant
          disabled: true
        # 函数长度由 funlen 统一把关
        - name: function-length
          disabled: true
        # API 包按资源聚合请求/响应结构,公开结构数不是复杂度信号
        - name: max-public-structs
          disabled: true
        # 圈复杂度与认知复杂度二选一:字节级解析器天然分支多,只保留更贴近可读性的认知复杂度
        - name: cyclomatic
          disabled: true
        # JSON 响应与测试里的匿名嵌套结构是惯用法
        - name: nested-structs
          disabled: true
        # purge / degraded 这类布尔参数是领域事实,不是控制耦合
        - name: flag-parameter
          disabled: true
        # if-init 把 err 的作用域限定在这次判断内,是全仓库统一的写法;参数是结构体字面量时 init 必然跨行,
        # 把调用提到 if 之前会让 err 进入外层作用域,与同一函数里其他调用的 err 混用
        - name: multiline-if-init
          disabled: true
        - name: cognitive-complexity
          arguments: [15]
        - name: line-length-limit
          arguments: [120]
        - name: context-as-argument
          arguments: [{ allowTypesBefore: "*testing.T" }]
        # 这些调用按文档永不返回错误(Builder/Hash 的 Write、Print 到标准输出/错误),逐处 `_ =` 只是噪音
        - name: unhandled-error
          arguments: ["fmt\\.Print.*", "fmt\\.Fprint.*", "strings\\.Builder\\..*", "hash\\.Hash\\.Write", "io\\.Writer\\.Write"]
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # 测试函数按用例自然铺开,长度与复杂度不设红线;只守注释与行宽
      - path: _test\.go$
        linters: [funlen]
      - path: _test\.go$
        linters: [revive]
        text: "cognitive-complexity"
      # gosec 针对的是攻击面,测试代码不是:构造固定字节载荷的整数转换、为造出不可写目录而 chmod、
      # 断言错误凭证被拒用的桩值,都会被当成安全问题
      - path: _test\.go$
        linters: [gosec]
      # 测试替身须与被测代码的回调签名一致,返回值恒为 nil 正是替身的本意
      - path: _test\.go$
        linters: [unparam]
      # 感知哈希以位模式存进 SQLite 的有符号 INTEGER,与无符号哈希之间的转换是位重解释,不是数值转换;
      # 这类转换全部收在这一个文件里
      - path: internal/infra/imaging/phash\.go$
        linters: [gosec]
        text: "G115"
      # 设置项的列名 cdn_cloudflare_api_token 与公开的掩码哨兵是常量字面量,不是凭证;
      # 失败归类的说明文案以 ReasonAppCredentials 等常量为键、正文提到 Secret Key,同样不是凭证
      - path: internal/infra/config/store\.go$|internal/core/channel/editconfig\.go$|internal/core/channel/failure\.go$
        linters: [gosec]
        text: "G101"
      # 按 rclone 的存储格式序列化 OAuth 令牌正是该函数的职责,产物随渠道配置以 AES-GCM 加密入库
      - path: internal/core/channel/oauth\.go$
        linters: [gosec]
        text: "G117"
      # 会话 cookie 恒设 HttpOnly 与 SameSite=Lax;Secure 按客户端到站点的第一跳是否 HTTPS 决定——
      # 纯 HTTP 部署时浏览器不保存 Secure cookie,恒设会让这类部署无法登录
      - path: internal/http/adminapi/auth\.go$
        linters: [gosec]
        text: "G124"

formatters:
  enable:
    - gofmt
    - goimports
