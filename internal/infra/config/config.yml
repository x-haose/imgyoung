# ImgYoung 内嵌默认配置(编译进二进制,随单文件分发)。
# 覆盖优先级:本文件(默认) < 外部 configs/config.yml < 环境变量(IMGYOUNG_*)。
# 各项语义与单位见 README 配置表;此处只承载默认值。
listen: ":8721"              # HTTP 监听地址(默认避开 8080/8000/8888 等易冲突端口)
data_dir: "data"             # 数据目录(SQLite 与本地渠道)
token: ""                    # 引导 Token;非空则首启植入为管理员的 bootstrap Token(真相在 DB,可后台管理)
admin_password: ""           # 管理员初始密码;仅在管理员尚未设密时生效,之后以后台修改为准
master_key: ""               # 主密钥(64 位 hex);留空则用 data/master.key
max_upload_mb: 50            # 单图上限(MB)
max_concurrent_uploads: 8    # 上传并发上限
upload_rate_per_min: 0       # 每用户每分钟上传次数上限,超出 429;0 = 不启用
base_url: ""                 # 对外站点地址;留空则上传响应返回相对路径
max_pixels_mp: 50            # 像素预算(百万像素)
referer_whitelist: []        # 防盗链白名单;空表示不启用
allow_empty_referer: true    # 空 Referer 是否放行
exif_policy: "passthrough"   # 全局 EXIF 档位:passthrough / strip
min_success: 1               # 上传成功所需的最少同步副本数
access_mode: "proxy"         # 访问模式:proxy / redirect
encrypt_new_channels: false  # 新建渠道未显式指定时是否加密
health_check_seconds: 60     # 渠道健康检查间隔(秒)
backup_interval_hours: 24    # 元数据库自动备份间隔(小时)
backup_keep: 7               # 备份保留份数
cleanup_sweep_seconds: 60    # 生命周期清理扫描间隔(秒)
delete_grace_minutes: 0      # 引用归零到物理删的宽限(分钟),0 = 立即
default_ttl_hours: 0         # 全局默认 TTL(小时),0 = 永不过期;单次上传可覆盖
ttl_renew_on_access: true    # 访问即续期:公开访问把带 TTL 图片的到期时刻按其时长顺延(随活跃度批量落库)
activity_flush_seconds: 60   # 访问活跃度批量落库间隔(秒)
cold_cleanup_days: 90        # 冷图待清理阈值(天),超期未访问打标签;0 = 不启用
usage_report_seconds: 300    # 渠道用量上报间隔(秒)
channel_quota_gb: 0          # 单渠道用量告警阈值(GB),超过则告警;0 = 不告警仅上报
dedup_scan_seconds: 300      # 后台查重扫描间隔(秒),精确合并与相似扫描同轮执行
dedup_phash_max_distance: 10 # pHash 相似判定的汉明距离上限,越大越宽松;0 = 不做相似扫描
# 按需处理(仅 access_mode=proxy 生效):参数档位白名单化,防任意参数打满 CPU、提高缓存命中
process_widths: [100, 200, 400, 800, 1600]  # 允许的宽度档(像素),档外请求 400;空列表=不允许缩放
process_formats: ["webp", "jpeg", "png"]    # 允许的目标格式,档外 400;gif 仅收发原图不做处理
process_quality_webp: 80     # webp 质量档 [0,100]
process_quality_jpeg: 85     # jpeg 质量档 [1,100]
process_webp_method: 4       # webp 质量/速度权衡 [0,6],越大越慢体积越小
process_workers: 4           # 处理并发上限(信号量),防重编码打满 CPU
process_timeout_ms: 5000     # 单请求处理超时(毫秒),超时回退原图
variants_cache_mb: 10240     # variant 磁盘缓存上限(MB),超过按 last_access LRU 淘汰
